.read-col.c1 > .panel,
.read-col.c3 > .panel {
  min-height: 0;
}

/* Columna 1: el editor absorbe el alto que sobra. */
.read-col.c1 {
  display: flex;
  flex-direction: column;
}
.read-col.c1 > .panel {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
}
.read-col.c1 .read-editor {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.read-col.c1 .read-editor textarea {
  flex: 1 1 auto;
  min-height: 120px;
  resize: none;
}

/* Columna 3: paso 3 crece, entregables se queda abajo. */
.read-col.c3 {
  display: flex;
  flex-direction: column;
}
.read-col.c3 > .panel:first-child {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.read-col.c3 > .panel:first-child > .panel-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}
.read-col.c3 > .panel:last-child {
  flex: none;
}

/* Columna 2: presets con scroll propio y bandeja de importacion fija abajo. */
.read-col.c2 {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.read-col.c2 > .preset-panel {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
/*
  Preset 4 por vista en rejilla 2x2, todas del mismo tamano. La bandeja trae
  su propio carril: en vertical ocupa el alto que sobra y en horizontal se
  desplaza por paginas de 4.
*/
.read-col.c2 > .preset-panel > .preset-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.read-col.c2 .tray {
  flex: 1 1 auto;
  min-height: 0;
  grid-template-rows: minmax(0, 1fr) auto;
}
.read-col.c2 .tray-viewport {
  --tray-cols: 2;
  --tray-rows: 2;
  grid-template-rows: repeat(2, minmax(0, 1fr));
  align-content: stretch;
  min-height: 0;
}
/* Iguales dimensiones: la tarjeta llena su celda, no su contenido. */
.read-col.c2 .tray-viewport > .preset-card {
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.read-col.c2 .tray-viewport > .preset-card p {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.read-col.c2 .tray-viewport > .preset-card .specs {
  margin-top: auto;
}
.read-col.c2 > .tray-import {
  flex: none;
}
/*
  La bandeja de importacion no scrollea entera: el drop zone se queda fijo y
  solo la lista de documentos tiene carril. El padre no lleva overflow a
  proposito, para que arrastrar sobre el drop no mueva nada.
*/
.read-col.c2 > .tray-import {
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.read-col.c2 > .tray-import > .panel-body {
  flex: 1 1 auto;
  min-height: 0;
  max-height: 40vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.read-col.c2 > .tray-import .drop-import {
  flex: none;
}
.read-col.c2 > .tray-import .file-list {
  flex: 1 1 auto;
  min-height: 60px;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: grid;
  gap: var(--space-2);
  align-content: start;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.read-col.c2 > .tray-import .file-list::-webkit-scrollbar {
  width: 0;
  height: 0;
}

/* Los 12 presets en dos columnas, para que quepan sin apretarse. */
/* Las tarjetas del preset conservan su alto: la rejilla del cuerpo decide. */
.read-col.c2 .preset-card {
  height: auto;
}

/* Pantallas bajas: mejor un carril propio que recortar contenido. */
@media (max-height: 760px) and (min-width: 1281px) {
  .read-col.c1,
  .read-col.c3 {
    overflow-y: auto;
  }
  .read-col.c3 > .panel:first-child > .panel-body {
    overflow: visible;
  }
  .produce-screen .inspector-body {
    overflow-y: auto;
  }
  .produce-screen .takes-list {
    max-height: 120px;
  }
}

@media (max-width: 1280px) {
  .read-col.c1,
  .read-col.c2,
  .read-col.c3 {
    overflow: visible;
    display: grid;
  }
  .read-col.c1 .read-editor textarea {
    min-height: 200px;
  }
  .read-col.c2 > .preset-panel > .preset-body,
  .read-col.c3 > .panel:first-child > .panel-body,
  .read-col.c2 > .tray-import > .panel-body {
    max-height: none;
    overflow: visible;
  }
}

/* -------------------------------------------------------------------------
   DISENO DE VOZ: todo a la vista, sin scroll.
   Tres columnas: lo que se pide al motor, el resultado y la biblioteca.
   La biblioteca tiene su propio carril; las otras dos crecen con el contenido.
   ------------------------------------------------------------------------- */

.design-screen {
  min-height: 0;
}

.design-board {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr) minmax(0, 1fr);
  gap: var(--space-3);
  flex: 1 1 auto;
  min-height: 0;
  align-items: stretch;
}

.design-prompt-col,
.design-result-col,
.design-library-col {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

/* ---- Columna 1: mitad descripcion, mitad motor, ambas exactas ---------- */

.design-prompt-col > .panel-head {
  flex: none;
}

.prompt-half {
  flex: 1 1 50%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-3) var(--space-2);
  overflow: hidden;
}
/* El cajon de texto se queda con el alto de su mitad. */
.prompt-half .prompt-box {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.prompt-half .prompt-box textarea {
  flex: 1 1 auto;
  min-height: 0;
  resize: none;
}
.prompt-half .prompt-actions {
  flex: none;
}
.prompt-half .segmented {
  flex: none;
}
/*
  El tirador de redimensionado del textarea se dibuja fuera de la caja y,
  como aqui el alto lo manda el reparto de la columna, se quita: era el
  cuadradito que aparecia pegado al borde inferior del prompt.
*/
.prompt-half .prompt-box textarea::-webkit-resizer,
.engine-half textarea::-webkit-resizer,
.design-result-col .sample-box::-webkit-resizer {
  display: none;
}
/* La nota del mejorador ocupa una linea y no empuja el alto. */
.prompt-half .prompt-footnote {
  flex: none;
  margin: 0;
}
.prompt-note.compact {
  flex: none;
  align-items: center;
  gap: var(--space-2);
  padding: 5px 8px;
}
.prompt-note.compact > div {
  min-width: 0;
  overflow: hidden;
  font-size: var(--text-xs);
  white-space: nowrap;
  text-overflow: ellipsis;
}

.engine-half {
  flex: 1 1 50%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 0 var(--space-3) var(--space-3);
  border-top: 1px solid var(--line);
  padding-top: var(--space-2);
  overflow: hidden;
}
.engine-half .engine-fields {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  overflow: hidden;
}
.engine-half .field-group {
  min-height: 0;
}
/*
  El grupo del motor se queda con el alto que sobra para llegar al margen
  inferior. En CosyVoice lo aprovecha el cajon de la referencia; en Qwen, el
  grupo de atributos reparte su espacio con la nota del backend.
*/
.engine-half .field-group {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
}
.engine-half .field-group > .drop {
  flex: 1 1 auto;
  min-height: 0;
}
/* CosyVoice: el cajon de la referencia crece hasta el margen. */
.engine-half .field-group:last-child > .drop {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  justify-content: center;
}
/* Qwen: la nota se queda abajo y se compacta a dos lineas. */
.engine-half .field-group > .prompt-note {
  margin-top: auto;
  font-size: var(--text-xs);
  line-height: 1.4;
}

/*
  CosyVoice Instruct-TTS: estilo, emocion, sampling K, ganancia y velocidad en
  una sola fila. Asi la referencia y su transcripcion se llevan el alto que
  sobra y la seccion de atributos toca el margen inferior sin scroll.
*/
.cosy-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 78px 108px 108px;
  gap: var(--space-2);
  align-items: end;
}
.cosy-row > * {
  min-width: 0;
}
.cosy-row .cosy-range {
  min-width: 0;
}
.cosy-row .range-top {
  gap: 3px;
  font-size: var(--text-xs);
  letter-spacing: 0;
}
.cosy-row .range-top b {
  font-size: var(--text-xs);
}
.cosy-contract {
  margin: 0;
  font-size: var(--text-xs);
}

/*
  La transcripcion de la referencia es el unico bloque elastico: crece hasta
  tocar el margen inferior. Su textarea no lleva tirador ni scroll propio
  mientras el texto quepa.
*/
.engine-half .field-group:last-child > .ref-transcript {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  margin-top: var(--space-2);
}
.engine-half .field-group:last-child > .ref-transcript > .field {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.engine-half .field-group:last-child textarea {
  flex: 1 1 auto;
  min-height: 44px;
  resize: none;
}

/* ---- Columna 2: resultado a todo el alto ------------------------------ */

.design-result-col > .panel-body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.design-result-col .sample-box {
  flex: 1 1 auto;
  min-height: 96px;
  resize: none;
}
.design-result-col .design-wave {
  flex: none;
}
.design-result-col .empty {
  flex: none;
}
/* Los dos botones, uno al lado del otro y siempre abajo. */
.design-actions {
  display: flex;
  flex-wrap: nowrap;
  gap: var(--space-2);
  margin-top: auto;
  padding-top: var(--space-2);
  flex: none;
}
.design-actions .btn {
  flex: 1 1 0;
  min-width: 0;
  justify-content: center;
  white-space: nowrap;
}

/* ---- Columna 3: fijo arriba, solo la lista se desplaza ----------------- */

.design-library-col > .panel-body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  overflow: hidden;
}
.design-library-col .library-fixed {
  flex: none;
  display: grid;
  gap: var(--space-2);
}
.design-library-col #prompt-results {
  flex: 1 1 auto;
  min-height: 80px;
  overflow-y: auto;
  overscroll-behavior: contain;
}

/* Piezas del editor, mas compactas para que quepan sin desplazar. */
.design-prompt-col .prompt-box textarea {
  min-height: 92px;
}
.design-prompt-col .engine-fields .field-group {
  padding: 8px 10px;
}
.design-prompt-col .grid-2,
.design-prompt-col .grid-3,
.design-prompt-col .grid-4 {
  display: grid;
  gap: var(--space-2);
}
.design-prompt-col .grid-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.design-prompt-col .grid-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.design-prompt-col .grid-4 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}
.design-prompt-col .field label,
.design-prompt-col .field-hint {
  font-size: var(--text-xs);
}
.design-library-col .library-item .prompt-text {
  -webkit-line-clamp: 2;
}

@media (max-width: 1400px) {
  .design-board {
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  }
  .design-library-col {
    grid-column: 1 / -1;
  }
  .design-library-col > .panel-body {
    max-height: 320px;
  }
}
@media (max-width: 980px) {
  .design-board {
    grid-template-columns: minmax(0, 1fr);
  }
  .design-prompt-col .grid-4,
  .design-prompt-col .grid-3 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* -------------------------------------------------------------------------
   PRODUCIR: la pantalla no scrollea. La cabecera y la cola del proyecto son
   fijas; cada columna tiene su propio carril y solo se desplaza lo que lo
   necesita: la lista de documentos, la lista de segmentos y las tomas.
   ------------------------------------------------------------------------- */

.screen-fill.produce-screen {
  min-height: 0;
  overflow: hidden;
}

.produce-screen .produce-grid {
  flex: 1 1 auto;
  min-height: 0;
  align-items: stretch;
}

.produce-screen .produce-col {
  min-height: 0;
  height: 100%;
}

/* La columna del medio: cabecera fija y lista con su carril. */
.produce-screen .produce-col.editor {
  display: flex;
  flex-direction: column;
}
.produce-screen .produce-col.editor > .panel-head {
  flex: none;
}
.produce-screen #block-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}

/* Documentos: la cabecera del panel no se mueve. */
.produce-screen .produce-col.docs {
  display: flex;
  flex-direction: column;
}
.produce-screen .produce-col.docs > .panel-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}

/* Inspector: texto y datos fijos, las tomas con su propio carril. */
.produce-screen .produce-col.inspector {
  display: flex;
  flex-direction: column;
}
.produce-screen .inspector-body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.produce-screen .inspector-body > #block-text {
  flex: none;
  min-height: 70px;
  max-height: 120px;
}
.produce-screen .inspector-body > .spec-inline,
.produce-screen .inspector-body > .takes-head {
  flex: none;
}
.produce-screen .takes-list {
  flex: 1 1 auto;
  min-height: 46px;
  overflow-y: auto;
  display: grid;
  gap: 4px;
  align-content: start;
}
.produce-screen .inspector-actions {
  flex: none;
  margin-top: auto;
}

/* La cola del proyecto: fija al pie de la pantalla. */
.produce-screen .produce-queue {
  flex: none;
}
.produce-screen .produce-queue .queue-strip {
  height: auto;
}

/* ---- Franja de estado: progreso y reparto por rol --------------------- */

.produce-status {
  flex: none;
  display: grid;
  grid-template-columns: minmax(120px, 0.5fr) minmax(0, 2.5fr);
  align-items: center;
  gap: var(--space-4);
  padding: 8px var(--space-3);
}
.produce-status .ps-bar {
  height: 6px;
  border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden;
}
.produce-status .ps-bar i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--ok));
  transition: width 0.25s ease;
}
.produce-status .ps-items {
  display: flex;
  flex-wrap: wrap;
  gap: 4px var(--space-3);
  min-width: 0;
}
.produce-status .ps-item {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  max-width: 190px;
  font-size: var(--text-xs);
  color: var(--text-3);
}
.produce-status .ps-item .grow {
  min-width: 0;
}
.produce-status .ps-item b {
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.produce-status .ps-dot {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: var(--tone, var(--text-3));
}

/* ---- Segmentos: filtro en la cabecera, lista con su carril ----------- */

.produce-screen .produce-col.editor > .panel-head {
  gap: var(--space-2);
  flex-wrap: wrap;
}
.produce-screen .produce-col.editor .segmented {
  margin-left: auto;
}
.segmented.sm button {
  padding: 3px 8px;
  font-size: var(--text-xs);
}

/* ---- Cola: se despliega y ensena los trabajos ----------------------- */

.produce-screen .produce-queue .queue-strip {
  cursor: default;
}
.produce-screen .produce-queue .q-jobs {
  display: none;
}
.produce-screen .produce-queue.open .queue-strip {
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}
.produce-screen .produce-queue.open .q-jobs {
  display: grid;
  gap: 4px;
  max-height: 148px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 8px var(--space-4);
  border: 1px solid var(--line);
  border-top: 0;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  background: var(--surface);
}
.produce-screen .q-job {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
  font-size: var(--text-xs);
  color: var(--text-3);
}
.produce-screen .q-job .mono {
  color: var(--text-2);
}
.produce-screen .q-job .spacer {
  margin-left: auto;
}
.produce-screen .q-jobs {
  scrollbar-width: none;
  -ms-overflow-style: none;
}

/* ---- Adaptaciones de ancho ------------------------------------------- */

@media (max-width: 1280px) {
  .produce-grid {
    grid-template-columns: 208px minmax(360px, 1fr) 272px;
  }
}

@media (max-width: 1100px) {
  .produce-status {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--space-2);
  }
}

@media (max-width: 1160px) {
  .screen-fill.produce-screen {
    overflow: visible;
  }
  .produce-screen .takes-list {
    max-height: 180px;
  }
}

/* =======================================================================
   CLONACION DE VOZ
   Tres columnas: asistente con pasos y presets, zona de trabajo que scrollea
   sola, y resultado fijo abajo con los dos botones. Solo la columna central
   se desplaza; nunca la ventana ni la cabecera del modulo.
   ======================================================================= */

.clone-screen {
  align-content: normal;
}

.clone-board {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(210px, 0.72fr) minmax(360px, 1.9fr) minmax(272px, 1fr);
  gap: var(--space-3);
  align-items: stretch;
}

.clone-board > .panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}
.clone-board > .panel > .panel-head {
  flex: none;
}

/* ---- Columna 1: pasos y presets --------------------------------------- */

.clone-steps > .panel-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.clone-steps > .panel-body.clone-presets {
  flex: 1 1 auto;
  border-top: 1px solid var(--line);
}

.clone-step {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: 100%;
  min-width: 0;
  padding: 8px 10px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: none;
  color: var(--text-2);
  text-align: left;
  cursor: pointer;
}
.clone-step:hover {
  background: var(--surface-2);
}
.clone-step.active {
  border-color: var(--accent-line, var(--accent));
  background: var(--accent-soft, var(--surface-2));
  color: var(--text);
}
.clone-step .step-num {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-size: var(--text-xs);
  font-weight: 600;
}
.clone-step.done .step-num {
  border-color: var(--ok);
  color: var(--ok);
}
.clone-step.active .step-num {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-ink, #fff);
}
.clone-step .step-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.clone-step .step-text b {
  font-size: var(--text-sm);
  font-weight: 600;
}
.clone-step .step-text small {
  overflow: hidden;
  font-size: var(--text-xs);
  color: var(--text-3);
  white-space: nowrap;
  text-overflow: ellipsis;
}

.clone-preset {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  width: 100%;
  min-width: 0;
  padding: 7px 8px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: none;
  color: var(--text-2);
  text-align: left;
  cursor: pointer;
}
.clone-preset:hover {
  background: var(--surface-2);
}
.clone-preset.active {
  border-color: var(--accent);
  background: var(--accent-soft, var(--surface-2));
  color: var(--text);
}
.clone-preset > span:last-child {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.clone-preset b {
  font-size: var(--text-sm);
  font-weight: 600;
}
.clone-preset small {
  overflow: hidden;
  font-size: var(--text-xs);
  color: var(--text-3);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

/* ---- Columna 2: trabajo. Solo ella scrollea ---------------------------- */

.clone-main > .panel-body.clone-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.clone-block {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.field-title-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}
.field-title-row .btn {
  margin-left: auto;
}

.clone-transcript {
  min-height: 74px;
  max-height: 160px;
  resize: vertical;
}

.clone-recorder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: var(--space-4);
  border: 1px dashed var(--line-strong, var(--line));
  border-radius: var(--radius-md);
  background: var(--surface-2);
  text-align: center;
}
.clone-recorder.recording {
  border-color: var(--danger);
}
.rec-dot {
  width: 14px;
  height: 14px;
  border-radius: 999px;
  background: var(--text-3);
}
.clone-recorder.recording .rec-dot {
  background: var(--danger);
  animation: recPulse 1s ease-in-out infinite;
}
@keyframes recPulse {
  50% {
    opacity: 0.25;
  }
}
.rec-time {
  font-size: var(--text-2xl);
  font-variant-numeric: tabular-nums;
}
.rec-bar {
  width: 100%;
  height: 5px;
  border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden;
}
.rec-bar i {
  display: block;
  height: 100%;
  background: var(--danger);
  transition: width 0.2s ease;
}

/* Limpieza: seis tarjetas en tres columnas. */
.clean-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-2);
}
.clean-card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  padding: 8px 9px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--tone, var(--line));
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text-2);
  text-align: left;
  cursor: pointer;
}
.clean-card:hover {
  border-color: var(--line-strong, var(--accent));
}
.clean-card.active {
  border-color: var(--accent);
  border-left-color: var(--tone, var(--accent));
  background: var(--accent-soft, var(--surface-3));
  color: var(--text);
}
.clean-card b {
  font-size: var(--text-sm);
  font-weight: 600;
}
.clean-card small {
  font-size: var(--text-xs);
  color: var(--text-3);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Motores: tres tarjetas, la elegida con borde de acento. */
.engine-pick {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-2);
}
.engine-card {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text-2);
  text-align: left;
  cursor: pointer;
}
.engine-card:hover {
  border-color: var(--line-strong, var(--accent));
}
.engine-card.active {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
  background: var(--accent-soft, var(--surface-3));
  color: var(--text);
}
.engine-card header {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.engine-card header b {
  min-width: 0;
  overflow: hidden;
  font-size: var(--text-sm);
  white-space: nowrap;
  text-overflow: ellipsis;
}
.engine-card header .badge {
  flex: none;
  margin-left: auto;
}
.engine-card p {
  margin: 0;
  font-size: var(--text-xs);
  color: var(--text-3);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.engine-card .specs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  margin-top: auto;
  font-size: var(--text-xs);
  color: var(--text-3);
}

/* Avisos de la referencia. */
.clone-notes {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.clone-note {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--line);
  background: var(--surface-2);
  font-size: var(--text-xs);
  color: var(--text-2);
}
.clone-note.danger {
  border-left-color: var(--danger);
}
.clone-note.warn {
  border-left-color: var(--warn);
}
.clone-note.info {
  border-left-color: var(--info, var(--accent));
}
.clone-note svg {
  flex: none;
  margin-top: 1px;
}

/* ---- Columna 3: resultado fijo, botones abajo -------------------------- */

.clone-result > .panel-body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  overflow: hidden;
}
.clone-result .clone-sample {
  flex: 1 1 auto;
  min-height: 84px;
  resize: none;
}
.clone-result .empty,
.clone-result .design-wave,
.clone-result .spec-inline {
  flex: none;
}
.clone-take {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  flex: none;
}
.clone-actions {
  display: flex;
  flex-wrap: nowrap;
  gap: var(--space-2);
  margin-top: auto;
  padding-top: var(--space-2);
  flex: none;
}
.clone-actions .btn {
  flex: 1 1 0;
  min-width: 0;
  justify-content: center;
  white-space: nowrap;
}
.clone-actions .btn[disabled] {
  opacity: 0.45;
  cursor: not-allowed;
}
.clone-result > .panel-body > .tiny.dim {
  flex: none;
  margin: 0;
}

/* ---- Adaptaciones de ancho ------------------------------------------- */

@media (max-width: 1180px) {
  .clone-board {
    grid-template-columns: minmax(180px, 0.7fr) minmax(320px, 1.6fr);
  }
  .clone-result {
    grid-column: 1 / -1;
  }
  .clone-result > .panel-body {
    overflow-y: auto;
  }
  .clone-result .clone-sample {
    min-height: 70px;
  }
}

@media (max-width: 840px) {
  .clone-board {
    grid-template-columns: minmax(0, 1fr);
  }
  .clone-main > .panel-body.clone-body {
    overflow-y: visible;
  }
  .clean-grid,
  .engine-pick {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 560px) {
  .clean-grid,
  .engine-pick {
    grid-template-columns: minmax(0, 1fr);
  }
  .clone-actions {
    flex-wrap: wrap;
  }
}

/* =======================================================================
   QWEN VOICE STUDIO
   Tres columnas (biblioteca / trabajo / laboratorio) y dos franjas fijas
   (historial y auditoria de prompts). Solo se desplazan las listas: la
   pantalla nunca scrollea entera y las cabeceras no se mueven.
   ======================================================================= */

.qwen-screen {
  align-content: normal;
  overflow: hidden;
}

.qwen-screen > .qwen-head {
  flex: none;
}

.qwen-board {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(212px, 0.78fr) minmax(420px, 1.85fr) minmax(268px, 1fr);
  gap: var(--space-3);
  align-items: stretch;
}

.qwen-col {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}
.qwen-col > .panel-head {
  flex: none;
}

/* ---- Columna 1: biblioteca de perfiles -------------------------------- */

.qwen-library-fixed {
  flex: none;
  gap: var(--space-2);
}
.qwen-library-list {
  flex: 1 1 auto;
  min-height: 90px;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-top: var(--space-2);
  border-top: 1px solid var(--line);
}

.qwen-profile {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: 100%;
  min-width: 0;
  padding: 7px 8px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: none;
  color: var(--text-2);
  text-align: left;
  cursor: pointer;
}
.qwen-profile:hover {
  background: var(--surface-2);
}
.qwen-profile.active {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: var(--text);
}
.qwen-profile .qp-dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--tone, var(--accent));
}
.qwen-profile .qp-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.qwen-profile .qp-text b {
  overflow: hidden;
  font-size: var(--text-sm);
  font-weight: 600;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.qwen-profile .qp-text small {
  font-size: var(--text-xs);
  color: var(--text-3);
}
.qwen-profile .qp-count {
  flex: none;
  margin-left: auto;
  font-size: var(--text-xs);
  color: var(--text-3);
}

/* ---- Columna 2: trabajo ----------------------------------------------- */

.qwen-col.work > .panel-body.qwen-work-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.qwen-copilot {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  flex: none;
}
.qwen-description {
  min-height: 76px;
  resize: none;
}

.qwen-notes {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.qwen-note {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--line);
  background: var(--surface-2);
  font-size: var(--text-xs);

}
.qwen-fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-2);
}
.qwen-fields .field {
  gap: 3px;
  min-width: 0;
}
.qwen-fields .field > span {

  color: var(--text-3);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  font-weight: 600;

.qwen-fields .input {

.qwen-compiled {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  flex: none;

.qwen-instruction {
  margin: 0;
  max-height: 132px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: var(--space-3);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  line-height: 1.55;
  color: var(--text-2);
  white-space: pre-wrap;
}
.qwen-parts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px var(--space-3);
}
.qwen-parts > div {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.qwen-parts span {
  font-size: var(--text-xs);
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-4);
}
.qwen-parts b {
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--text-2);
  line-height: 1.4;
}

  flex-direction: column;
  gap: var(--space-2);
}
.qwen-speech {
  min-height: 96px;
  resize: none;
}
.qwen-actions {
  display: flex;
  flex-wrap: nowrap;
  gap: var(--space-2);
  margin-top: auto;
  padding-top: var(--space-2);
}
.qwen-actions .btn {
  flex: 1 1 0;
  min-width: 0;
  justify-content: center;
  white-space: nowrap;
}
.qwen-actions .btn[disabled] {
  opacity: 0.45;
  cursor: not-allowed;
}
.qwen-render {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  flex: none;
}
.text-danger {
  color: var(--danger);
}

.qwen-history {
  flex: none;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3);
  max-height: 168px;
}
.qwen-history-list {

  gap: var(--space-2);
  min-height: 0;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 2px;
}
.qwen-render-card {

  flex-direction: column;
  gap: 4px;
  flex: none;
  width: 250px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface-2);
}
.qwen-render-card header {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.qwen-render-card header b {
  overflow: hidden;
  font-size: var(--text-sm);
  white-space: nowrap;
  text-overflow: ellipsis;
}
.qwen-render-card p {
  margin: 0;

.qwen-prompts > .panel-body {

.qwen-prompt-list {

.qwen-prompt {

.qwen-prompt.open {

.qwen-library-list,

.qwen-col.lab > .panel-body.qwen-lab-body::-webkit-scrollbar,
.qwen-history-list::-webkit-scrollbar,

@media (max-width: 1320px) {

// Generador determinista con mezcla previa: evita la correlacion de semillas
// consecutivas que dejaba todos los bloques en el mismo estado.
function seeded(seed) {
  let s = (seed ^ 0x9e3779b9) >>> 0;
  s = Math.imul(s ^ (s >>> 16), 0x21f0aaad) >>> 0;
  s = Math.imul(s ^ (s >>> 15), 0x735a2d97) >>> 0;
  s = (s ^ (s >>> 15)) >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const charsPerSecond = { piper: 15.4, kokoro: 14.6, mms: 12.6, styletts2: 14.2, qwen3_tts: 13.4, cosyvoice: 13.8, f5_spanish: 14.0 };

function buildTakes(block, seed) {
  const rand = seeded(seed);
  const count = rand() > 0.62 ? 2 : 1;
  const takes = [];
  for (let i = 0; i < count; i += 1) {
    const meta = takeMeta[Math.floor(rand() * takeMeta.length)];
    const sr = engineById(meta.engine).sr;
    const base = block.text.length / (charsPerSecond[meta.engine] || 14);
    const duration = Math.max(0.9, base * (0.94 + rand() * 0.12));
    takes.push({
      id: `${block.id}-t${i + 1}`,
      engine: meta.engine,
      voice: meta.voice,
      speed: meta.speed,
      duration: Math.round(duration * 100) / 100,
      sr,
      rtf: Math.round((engineById(meta.engine).rtf * (0.9 + rand() * 0.2)) * 1000) / 1000,
      createdAt: `${7 - i * 2} min`,
      qa: meta.qa,
    });
  }
  return takes;
}

function buildBlocks(docId, texts, rolePlan) {
  return texts.map((text, index) => {
    const id = `${docId}-${String(index + 1).padStart(3, '0')}`;
    const role = rolePlan(index);
    const rand = seeded(index * 977 + docId.charCodeAt(1) * 31 + 13);
    const roll = rand();
    let state = 'aprobado';
    if (roll > 0.88) state = 'revisar';
    else if (roll > 0.74) state = 'pendiente';
    const takes = buildTakes({ id, text }, index * 7919 + 41);
    const chosen = takes.length - 1;
    return {
      id,
      docId,
      role,
      text,
      state,
      takes,
      chosenTakeId: takes[chosen].id,
      target: null,
      qaIssue:
        state === 'revisar'
          ? roll > 0.94
            ? 'duracion'
            : 'cobertura'
          : null,
    };
  });
}

// Acceso por id al catalogo. Se llama catalogVoice (y no voiceById) porque
// data.js ya expone voiceById para el elenco antiguo: un paquete plano
// (prototipo-atlas.html) no admite dos funciones con el mismo nombre.
const catalogVoice = (id) => CATALOG.find((voice) => voice.id === id) || null;

/** Recuento por motor, siempre sobre el catalogo completo. */
function catalogCounts() {
  const counts = {};
  CATALOG.forEach((voice) => {
    counts[voice.engine] = (counts[voice.engine] || 0) + 1;
  });
  return counts;
}

const CATALOG_TOTAL = CATALOG.length;

/** Motores con su recuento real, para la pantalla de voces. */
function catalogByEngine() {
  const counts = catalogCounts();
  return Object.keys(counts).map((engineId) => ({
    engine: engineById(engineId),
    voices: CATALOG.filter((voice) => voice.engine === engineId),
    count: counts[engineId],
  }));
}

function pick(list, index) {
  return list[index % list.length];
}

const genderWord = (gender) => (gender === 'F' ? 'femenina' : gender === 'M' ? 'masculina' : 'androgina');

function buildVoiceDesign() {
  const out = [];
  FAMILIES.forEach((family, familyIndex) => {
    const timbrePool = family.gender === 'F' ? TIMBRES_F : family.gender === 'M' ? TIMBRES_M : TIMBRES_M.concat(TIMBRES_F);
    // Barrido combinatorio controlado: cada voz de la familia usa una combinacion distinta.
    for (let i = 0; i < 52; i += 1) {
      const accent = pick(ACCENTS, i * 3 + familyIndex);
      const age = pick(AGES, i * 2 + familyIndex);
      const timbre = pick(timbrePool, i * 7 + familyIndex * 3);
      const texture = pick(TEXTURES, i * 5 + familyIndex * 4);
      const gender = family.gender === 'MIX' ? (i % 2 === 0 ? 'F' : 'M') : family.gender;
      const text = family.build({
        age: age[1],
        timbre,
        accent: accent[1],
        texture,
        genderWord: genderWord(gender),
      });
      out.push({
        id: '',
        family: family.id,
        familyLabel: family.label,
        mode: 'voice_design',
        gender,
        accent: accent[0],
        text,
      });
    }
  });
  return out;
}

  ];
  STYLES.forEach((style, styleIndex) => {
    for (let i = 0; i < 19; i += 1) {
      const context = pick(STYLE_CONTEXTS, i + styleIndex);
      const action = pick(actions, i * 5 + styleIndex);
      const accent = pick(ACCENTS, i + styleIndex * 3);
      out.push({

      });
    }
  });
  return out;
}

function dedupe(list) {
  const seen = new Set();
  const out = [];
  list.forEach((item) => {
    const key = item.text.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    out.push(item);
  });
  return out;
}

function finalize(list) {
  return dedupe(list).map((item, index) => ({ ...item, id: `vp-${String(index + 1).padStart(4, '0')}` }));
}

const PROMPT_LIBRARY = finalize([...buildVoiceDesign(), ...buildInstruct()]);

  PROMPT_LIBRARY.forEach((item) => {
    if (!map.has(item.family)) map.set(item.family, { id: item.family, label: item.familyLabel, mode: item.mode, count: 0 });
    map.get(item.family).count += 1;
  });
  return Array.from(map.values());
})();

function searchPrompts(query, family, mode) {
  const q = (query || '').toLowerCase().trim();
  return PROMPT_LIBRARY.filter((item) => {
    if (family !== 'todas' && item.family !== family) return false;
    if (mode !== 'todos' && item.mode !== mode) return false;
    if (!q) return true;
    return `${item.text} ${item.familyLabel} ${item.accent}`.toLowerCase().includes(q);
  });
}

/* ------------------------------------------------------------------ *
 * VERSION MEJORADA
 *
 * La auditoria del modulo Qwen Voice Studio encontro que 654 de los 654
 * prompts de VoiceDesign no declaran emocion ni grabacion, y que ninguno
 * llega al maximo de los controles. En vez de reescribir la biblioteca a
 * mano (que destruiria el texto auditado), cada prompt guarda aqui su
 * version mejorada: el original se conserva intacto y se puede comparar.
 *
 * Las instrucciones de CosyVoice ya cumplen los cinco controles de su modo,
 * asi que su version mejorada es identica al original y no se duplica.
 * ------------------------------------------------------------------ */

// Frases fijas del compilador. Se anaden solo cuando el original no las dice.
const IMPROVE_ADDITIONS = [
  { check: 'age', re: /\b(anos|años|joven|adult[ao]|madur[ao]|senior|ancian)\b/i, text: 'adulta de unos 35 a 45 anos' },
  { check: 'timbre', re: /\b(timbre|grave|agudo|calid|brillante|nasal|ronc|asper|sedos|aterciopelad|metalic|profund)/i, text: 'timbre calido y aterciopelado' },
  { check: 'cadence', re: /\b(cadencia|ritmo|pausad|lento|rapid|agil|conversacional|contemplativ)\b/i, text: 'cadencia pausada y reflexiva' },
  { check: 'emotion', re: /\b(emocion|tono (alegre|serio|triste|solemne|ironic|epic)|alegre|solemne|triste|serio|ironic|misterios|urgente|tierno|epico|complice|divertid|melancol|seductor|autoritari|calmad|sarcast|nervios|entusiast)/i, text: 'emocion serena y contenida' },
  { check: 'accent', re: /\b(acento|castellano|mexican|rioplatense|colombian|chilen|peruan|caribe|venezolan|andaluz|latinoamerican|neutro)\b/i, text: 'acento castellano neutro de Espana' },
  { check: 'purpose', re: /\b(audiolibro|documental|comercial|spot|noticias|podcast|videojuego|doblaje|cuento|elearning|telefonia|ivr|poesia|meditacion|audiodescripcion|narracion|locucion)/i, text: '' },
  { check: 'recording', re: /\b(estudio|microfono|microfon|cercan|grabacion|reverberacion|sala peque|seca|distancia)/i, text: 'grabacion de estudio seca y cercana al microfono' },
];

/**
 * El proposito no se inventa: se deriva de lo que el texto ya dice que va a
 * hacer la voz. Si no se reconoce ninguna pista, no se anade nada.
 */
const PURPOSE_HINTS = [
  { re: /audiolibro|narrar|novela|ficcion literaria|capitulo/i, text: 'pensada para audiolibro de ficcion' },
  { re: /documental|divulgacion|cientific/i, text: 'pensada para documental de divulgacion' },
  { re: /spot|comercial|publicidad|cu[nñ]a/i, text: 'pensada para locucion comercial' },
  { re: /boletin|noticias|informativ|periodis/i, text: 'pensada para boletin informativo' },
  { re: /podcast|episodio|entrevista/i, text: 'pensada para podcast conversacional' },
  { re: /videojuego|npc|mision/i, text: 'pensada para videojuego' },
  { re: /doblaje|animacion|caricatur/i, text: 'pensada para doblaje de animacion' },
  { re: /cuento|infantil|ni[nñ]os/i, text: 'pensada para cuentos infantiles' },
  { re: /telefon|ivr|atencion al cliente/i, text: 'pensada para telefonia e IVR' },
  { re: /meditacion|respiracion|descanso/i, text: 'pensada para meditacion guiada' },
  { re: /poesia|teatro|recital/i, text: 'pensada para poesia y teatro' },
  { re: /audiodescripcion/i, text: 'pensada para audiodescripcion' },
  { re: /deporte|futbol|retransmision/i, text: 'pensada para radio deportiva' },
  { re: /elearning|formacion|curso|corporativ/i, text: 'pensada para formacion corporativa' },
];

/**
 * Version mejorada de un prompt de VoiceDesign: conserva el texto original y
 * anade, al final, solo los atributos que faltan.
 */
function improveVoiceDesignPrompt(text) {
  const original = String(text || '').trim();
  const faltantes = IMPROVE_ADDITIONS.filter((item) => item.re.test(original) === false && item.text).map((item) => item.text);
  // El proposito se toma de lo que el texto ya declara, nunca de un catalogo.
  if (!/\b(pensad[ao] para|para (un|una|el|la) )/.test(original)) {
    const pista = PURPOSE_HINTS.find((hint) => hint.re.test(original));
    if (pista) faltantes.push(pista.text);
  }
  if (!faltantes.length) return original;
  return `${original.replace(/\.$/, '')}, ${faltantes.join(', ')}.`;
}

/** La biblioteca con `improved` en cada entrada. Los instruct no cambian. */
const PROMPT_LIBRARY_V2 = PROMPT_LIBRARY.map((item) => ({
  ...item,
  improved: item.mode === 'voice_design' ? improveVoiceDesignPrompt(item.text) : item.text,
  added:
    item.mode === 'voice_design'
      ? [
          ...IMPROVE_ADDITIONS.filter((a) => !a.re.test(item.text) && a.text).map((a) => a.check),
          ...(!/\b(pensad[ao] para|para (un|una|el|la) )/.test(item.text) && PURPOSE_HINTS.some((h) => h.re.test(item.text))
            ? ['purpose']
            : []),
        ]
      : [],
}));

/** Cuantos prompts cambiarian y cuantos caracteres se anaden de media. */
const PROMPT_V2_STATS = (() => {
  const mejorados = PROMPT_LIBRARY_V2.filter((item) => item.improved !== item.text);
  const extra = mejorados.reduce((acc, item) => acc + (item.improved.length - item.text.length), 0);
  return {
    total: PROMPT_LIBRARY_V2.length,
    mejorados: mejorados.length,
    intactos: PROMPT_LIBRARY_V2.length - mejorados.length,
    mediaExtra: mejorados.length ? Math.round(extra / mejorados.length) : 0,
  };
})();

/** Busqueda sobre la version mejorada, con la misma firma que searchPrompts. */
function searchPromptsV2(query, family, mode) {
  const q = (query || '').toLowerCase().trim();
  return PROMPT_LIBRARY_V2.filter((item) => {
    if (family !== 'todas' && item.family !== family) return false;
    if (mode !== 'todos' && item.mode !== mode) return false;
    if (!q) return true;
    return `${item.improved} ${item.text} ${item.familyLabel} ${item.accent}`.toLowerCase().includes(q);
  });
}

/** Devuelve un texto de ejemplo de `limit` caracteres aproximados, sin cortar palabras. */
function sampleText(limit = TEXT_LIMIT) {
  const out = [];
  let length = 0;
  let index = 0;
  while (length < limit) {
    const paragraph = PARAGRAPHS[index % PARAGRAPHS.length];
    out.push(paragraph);
    length += paragraph.length + 2;
    index += 1;
  }
  let text = out.join('\n\n');
  if (text.length > limit) {
    const cut = text.lastIndexOf(' ', limit);
    text = `${text.slice(0, cut > 0 ? cut : limit)}...`;
  }
  return text;
}

/** Estimacion de tiempo de render con los RTF medidos, igual que el estimador real. */
function estimateRead(chars, rtf, chunks) {
  const seconds = Math.max(1, Math.round((chars / 14.5) * rtf));
  const perChunk = chunks > 0 ? seconds / chunks : 0;
  return { seconds, perChunk };
}

/**
 * Evalua la referencia contra lo que exige cada motor.
 * Devuelve avisos, no bloquea: el prototipo explica por que no se puede seguir.
 */
function evaluateReference(ref, engineId) {
  const engine = cloneEngineById(engineId);
  if (!ref) return { ok: false, nivel: 'vacio', avisos: [{ tono: 'warn', texto: 'Todavia no hay referencia.' }] };
  const avisos = [];
  if (ref.seconds < engine.minRef) {
    avisos.push({ tono: 'danger', texto: `Muy corta: ${engine.name} pide al menos ${engine.minRef} s y hay ${ref.seconds.toFixed(1)} s.` });
  }
  if (ref.seconds > engine.maxRef) {
    avisos.push({ tono: 'warn', texto: `Se recortara a ${engine.maxRef} s: el motor no usa mas.` });
  }
  if (!ref.transcript || ref.transcript.trim().length < 10) {
    avisos.push({ tono: 'danger', texto: 'Falta la transcripcion exacta: sin ella el condicionamiento no vale.' });
  }
  if (ref.channels > 1) {
    avisos.push({ tono: 'info', texto: `Se convierte a mono (${ref.channels} canales de origen).` });
  }
  if (ref.sr < 16000) {
    avisos.push({ tono: 'warn', texto: `Muestra baja (${ref.sr} Hz): el timbre saldra apagado.` });
  }
  if (!engine.commercial) {
    avisos.push({ tono: 'info', texto: `${engine.name} no es comercial: permitido en uso personal.` });
  }
  const nivel = avisos.some((a) => a.tono === 'danger') ? 'error' : avisos.some((a) => a.tono === 'warn') ? 'aviso' : 'ok';
  return { ok: nivel !== 'error', nivel, avisos };
}

/** Estimacion de la toma de prueba: duracion y coste en RTF. */
function estimateClone(engineId, seconds) {
  const engine = cloneEngineById(engineId);
  return { rtf: engine.rtf, segundos: Math.max(0.4, (seconds * engine.rtf)).toFixed(2) };
}

/**
 * Parser lexico de la descripcion libre. Mismo formato de salida que
 * POST /api/translate: { profile, analysis: { confidence, ambiguities, conflicts } }.
 */
function parseDescription(description) {
  const text = String(description || '').toLowerCase();
  const profile = emptyProfile();
  const hits = [];
  const ambiguities = [];

  if (!text.trim()) {
    return {
      profile,
      analysis: { confidence: 0, ambiguities: ['No hay descripcion que analizar.'], conflicts: [] },
      matched: 0,
    };
  }

  LEXICON.forEach((entry) => {
    if (!entry.re.test(text)) return;
    if (profile[entry.field] === null) {
      profile[entry.field] = entry.value;
      hits.push(entry);
      return;
    }
    if (profile[entry.field] === entry.value) return;

    // Segundo valor distinto para el mismo campo: gana el de mas peso.
    const previo = hits.filter((c) => c.field === entry.field).sort((a, b) => b.weight - a.weight)[0];
    if (previo && entry.weight > previo.weight) {
      ambiguities.push(`«${entry.field}»: el texto sugiere «${entry.value}» y «${previo.value}»; se aplico el de mas peso.`);
      profile[entry.field] = entry.value;
      hits.push(entry);
    } else if (previo) {
      ambiguities.push(`«${entry.field}» podria ser «${entry.value}», pero el texto lo describe como «${previo.value}».`);
    }
  });

  // La edad en cifras gana al adjetivo.
  const edadExplicita = text.match(/\b(?:de|con|tiene|unos|aparenta)\s+(\d{1,3})\s*(?:anos|años)\b/);
  if (edadExplicita) {
    const edad = Number(edadExplicita[1]);
    if (edad >= 5 && edad <= 100) {
      if (profile.age !== null && profile.age !== edad) {
        ambiguities.push(`Hay dos edades en el texto: se aplica la cifra explicita (${edad} anos).`);
      }
      profile.age = edad;
    }
  }

  const conflicts = CONFLICTS.filter((item) => item.test(profile)).map((item) => item.text);

  const cubiertos = VOICE_FIELDS.filter((f) => profile[f.id] !== null).length / VOICE_FIELDS.length;
  const pesoMedio = hits.length ? hits.reduce((acc, h) => acc + h.weight, 0) / hits.length : 0;
  let confidence = cubiertos * 0.7 + pesoMedio * 0.3;
  if (conflicts.length) confidence *= 0.85;
  confidence = Math.max(0, Math.min(1, Number(confidence.toFixed(2))));

  if (!hits.length) {
    ambiguities.push('No se reconocio ningun atributo: describe genero, edad, timbre, emocion o acento.');
  } else if (cubiertos < 0.35) {
    ambiguities.push('El texto cubre pocos atributos: el prompt compilado sera generico.');
  }

  return { profile, analysis: { confidence, ambiguities, conflicts }, matched: hits.length };
}

*/
const GENDER = {

  femenino: 'A feminine-sounding voice',
  androgino: 'An androgynous-sounding voice',
};
const PITCH = { grave: 'low-pitched', medio: 'mid-pitched', agudo: 'high-pitched' };
const PACING = {
  lento: 'slow and measured pacing',
  conversacional: 'natural conversational pacing',
  rapido: 'brisk but intelligible pacing',
};
const ENERGY = {
  letargica: 'very low vocal energy',
  contenida: 'restrained vocal energy',
  conversacional: 'natural conversational energy',
  proyectada: 'confident projected delivery',
  euforica: 'highly energetic delivery',
};
const F0 = {
  plana: 'minimal pitch variation',
  estable: 'controlled natural intonation',
  dinamica: 'naturally varied intonation',
  expresiva: 'expressive melodic intonation',
  erratica: 'deliberately unstable intonation',
};
const BREATH = {
  nula: 'clean, minimally breathy phonation',
  ligera: 'subtly airy phonation',
  natural: 'natural breathiness',
  fuerte: 'noticeably breathy phonation',
};
const ARTICULATION = {
  relajada: 'relaxed articulation',
  normal: 'natural clear articulation',
  precisa: 'crisp and precise articulation',
};
const RECORDING = {
  cercana: 'an intimate, close-recorded impression',
  estudio: 'a clean, dry studio-recorded impression',
  media: 'a natural conversational recording impression',
  lejana: 'a slightly distant vocal impression',
};
const FORMANTS = {
  calidos: 'warm and rounded vocal resonance',
  neutros: 'balanced vocal resonance',
  brillantes: 'bright vocal resonance',
};

const joinParts = (parts) => parts.filter(Boolean).join('; ') || 'Natural voice';

/** Plantilla maestra: texto literal de MASTER_PROMPT del backend compartido. */
const MASTER_TEMPLATE = `You are preparing a natural-language voice design instruction for Qwen3-TTS VoiceDesign.

The target spoken language is Spanish.

Describe one coherent voice identity and one coherent delivery style. Preserve the intended accent, timbre and emotional tone.

VOICE IDENTITY:
{{identity}}

VOICE TIMBRE:
{{timbre}}

VOICE DELIVERY:
{{delivery}}

PERCEPTUAL RECORDING STYLE:
{{recording}}

GENERAL REQUIREMENTS:
Natural human speech, clear Spanish pronunciation, coherent prosody, stable vocal identity and intelligible articulation.

Avoid contradictory instructions and excessive exaggeration. Do not generate stage directions or sound effects as speech.`;

/** Las cuatro piezas del prompt, para poder ensenarlas por separado. */
function profileParts(profile) {
  const p = { ...emptyProfile(), ...profile };
  const tieneEdad = p.age !== null && p.age !== undefined && p.age !== '';
  return {
    identity: joinParts([
      GENDER[p.gender],
      tieneEdad ? `with the perceived maturity of a ${p.age}-year-old` : null,
      p.accent ? `speaking with a ${p.accent} accent` : null,
    ]),
    timbre: joinParts([
      p.texture ? `A ${p.texture} vocal texture` : null,
      PITCH[p.pitch],
      FORMANTS[p.formants],
      BREATH[p.breathiness],
    ]),
    delivery: joinParts([
      p.emotion ? `Convey ${p.emotion}` : null,
      p.purpose ? `Suitable for ${p.purpose}` : null,
      PACING[p.pacing],
      ENERGY[p.energy],
      F0[p.f0Curve],
      ARTICULATION[p.articulation],
    ]),
    recording: joinParts([RECORDING[p.micProximity]]),
  };
}

/**
 * Compila el perfil a la instruccion final. Determinista y sin variables sin
 * resolver: si quedara alguna, se lanza en vez de mandar un prompt roto.
 */
function compileProfile(profile, template = MASTER_TEMPLATE) {
  const parts = profileParts(profile);
  let out = template;
  Object.entries(parts).forEach(([key, value]) => {
    out = out.replaceAll(`{{${key}}}`, value);
  });
  const pendientes = out.match(/\{\{[^{}]+\}\}/g);
  if (pendientes) throw new Error(`Variables sin resolver: ${pendientes.join(', ')}`);
  return out.trim();
}

/** Cuantos de los catorce campos estan cubiertos y su porcentaje. */
function profileCoverage(profile) {
  const p = profile || {};
  const done = VOICE_FIELDS.filter((f) => p[f.id] !== null && p[f.id] !== undefined && p[f.id] !== '').length;
  return { done, total: VOICE_FIELDS.length, pct: Math.round((done / VOICE_FIELDS.length) * 100) };
}

/** El payload que viaja al motor, igual que el contrato del backend. */
function buildPayload({ text, instruction, profile, language = 'Spanish' }) {
  return {
    schema_version: '2.0',
    model: 'Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign',
    task: 'voice_design',
    input: { text, language, instruct: instruction },
    output: { format: 'wav' },
    profile: profile || null,
  };
}

/** Analiza un prompt y devuelve sus hallazgos ordenados por gravedad. */
function auditPrompt(text, mode = 'voice_design') {
  const original = String(text || '');
  // La instruccion de CosyVoice no lleva genero, edad ni timbre: pide entrega.
  if (mode === 'instruct_tts') {
    const checks = ['style', 'context', 'accent', 'length', 'clean'];
    const hallazgos = PROMPT_CHECKS.filter((c) => checks.includes(c.id) && !c.test(original)).map((c) => ({
      id: c.id,
      label: c.label,
      gravedad: c.gravedad,
      fix: c.fix,
    }));
    const orden = { alta: 0, media: 1, baja: 2 };
    hallazgos.sort((a, b) => orden[a.gravedad] - orden[b.gravedad]);
    return {
      hallazgos,
      puntos: Math.round(((checks.length - hallazgos.length) / checks.length) * 100),
      completo: hallazgos.length === 0,
    };
  }
  // Solo los controles de VoiceDesign: style y context son de la instruccion.
  const checksVD = PROMPT_CHECKS.filter((check) => !['style', 'context'].includes(check.id));
  const hallazgos = checksVD.filter((check) => !check.test(original)).map((check) => ({
    id: check.id,
    label: check.label,
    gravedad: check.gravedad,
    fix: check.fix,
  }));
  const orden = { alta: 0, media: 1, baja: 2 };
  hallazgos.sort((a, b) => orden[a.gravedad] - orden[b.gravedad]);
  const puntos = Math.round(((checksVD.length - hallazgos.length) / checksVD.length) * 100);
  return { hallazgos, puntos, completo: hallazgos.length === 0 };
}

/* Controles propios del prompt de instruccion (CosyVoice Instruct-TTS). */
PROMPT_CHECKS.push(
  {
    id: 'style',
    label: 'Estilo explicito',
    gravedad: 'alta',
    test: (text) => /^habla\b/i.test(text.trim()),
    fix: 'La instruccion empieza por "Habla ...": es el contrato de CosyVoice.',
  },
  {
    id: 'context',
    label: 'Contexto de habla',
    gravedad: 'media',
    test: (text) => /\b(corresponde a|en una|en un|durante|mientras)\b/i.test(text),
    fix: 'Di en que situacion se habla: da la intencion al motor.',
  },
);

/**
 * Mejora un prompt respetando lo que ya dice: no borra texto, anade por detras
 * solo lo que falta, con frases fijas del compilador. Si esta completo, se
 * devuelve tal cual y se dice.
 */
function improvePrompt(text, { accent = 'castellano neutro de Espana', purpose = '', mode = 'voice_design' } = {}) {
  const original = String(text || '').trim();
  const { hallazgos } = auditPrompt(original, mode);

  if (mode === 'instruct_tts') {
    const falta = new Set(hallazgos.map((h) => h.id));
    const partes = [];
    if (falta.has('style')) partes.push('Habla con tono sereno y cercano, modulando la intensidad en cada frase');
    if (falta.has('context')) partes.push('El texto corresponde a una lectura natural en voz alta');
    if (falta.has('accent')) partes.push(`y debe sonar con acento ${accent}`);
    return {
      text: partes.length ? `${original.replace(/\.$/, '')}. ${partes.join(', ')}.` : original,
      added: [...falta],
      changed: partes.length > 0,
    };
  }
  const falta = new Set(hallazgos.map((h) => h.id));
  if (!falta.size) return { text: original, added: [], changed: false };

  const frases = [];
  const added = [];
  const add = (id, frase) => {
    if (!falta.has(id)) return;
    frases.push(frase);
    added.push(id);
  };

  // Si el prompt no empieza por "Voz", se le da el encabezado del compilador.
  const encabezado = /^(voz|voz de)\b/i.test(original) ? '' : 'Voz ';
  // El genero lo aporta el encabezado o el propio texto, nunca una frase suelta.
  add('age', 'adulta de unos 35 a 45 anos');
  add('timbre', 'timbre calido y aterciopelado');
  add('cadence', 'cadencia pausada y reflexiva');
  add('emotion', 'emocion serena y contenida');
  add('accent', `acento ${accent}`);
  add('recording', 'grabacion de estudio seca y cercana al microfono');
  if (purpose) add('purpose', `pensada para ${purpose}`);

  // Se limpian los huecos de las frases vacias (el genero ya lo trae el texto).
  const limpio = frases.filter(Boolean);
  const texto = [encabezado + original.replace(/\.$/, ''), ...limpio].join(', ');
  return {
    text: texto.replace(/\s+,/g, ',').replace(/,\s*,/g, ',').replace(/,\s*\./g, '.') + '.',
    added,
    changed: true,
  };
}

// VozStudio Atlas - marca compartida.
// Un unico emblema para el sidebar, el icono de escritorio (favicon/PWA) y el splash.
// Geometria calcada de scripts/launcher/generate_icon.py: squircle obsidiana,
// borde cian luminoso y cinco barras acusticas con degradado cian.

const SIZE = 256;
const CENTER = SIZE / 2;
const RADIUS = SIZE * 0.44;
const CORNER = SIZE * 0.21;

// Mismas proporciones que el generador nativo del icono.
const BAR_X = [-0.46, -0.23, 0, 0.23, 0.46];
const BAR_H = [0.28, 0.52, 0.76, 0.48, 0.3];
const BAR_HALF_W = SIZE * 0.046;

function bars(fill = 'url(#vz-bar)') {
  return BAR_X.map((x, index) => {
    const px = CENTER + x * RADIUS * 0.85;
    const halfH = BAR_H[index] * RADIUS * 0.72;
    return `<rect x="${(px - BAR_HALF_W).toFixed(2)}" y="${(CENTER - halfH).toFixed(2)}" width="${(BAR_HALF_W * 2).toFixed(2)}" height="${(halfH * 2).toFixed(2)}" fill="${fill}"/>`;
  }).join('');
}

function defs(idPrefix) {
  return `<defs>
    <radialGradient id="${idPrefix}-glow" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#102742"/>
      <stop offset="100%" stop-color="#060b14"/>
    </radialGradient>
    <linearGradient id="${idPrefix}-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ed7f2"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>`;
}

/**
 * Emblema de la aplicacion. `plain` omite los gradientes (para data URI estable en favicon).
 */
function appMark(size = 34, { plain = false, rounded = true } = {}) {
  const uid = plain ? 'vzp' : 'vzm';
  const corner = rounded ? CORNER : 8;
  // A 18 px el aro de 9 unidades se come el dibujo y el degradado difumina las barras:
  // se afina el aro y se pinta el emblema en color plano.
  const small = size <= 22;
  const stroke = small ? 5 : 7;
  const barFill = small ? '#0ed7f2' : `url(#${uid}-bar)`;
  return `<svg class="app-mark" width="${size}" height="${size}" viewBox="0 0 ${SIZE} ${SIZE}" role="img" aria-label="VozStudio Atlas" focusable="false">
    ${defs(uid)}
    <rect x="7" y="7" width="${SIZE - 14}" height="${SIZE - 14}" rx="${corner}" fill="${small ? '#0a131c' : `url(#${uid}-glow)`}" stroke="#1aa3d8" stroke-width="${stroke}"/>
    ${bars(barFill)}
  </svg>`;
}

/**
 * Mismo emblema con identificadores fijos, listo para un data URI o un archivo .svg.
 * Conserva el resplandor y el degradado de las barras del icono real.
 */
function appMarkPlain() {
  const barRects = BAR_X.map((x, index) => {
    const px = CENTER + x * RADIUS * 0.85;
    const halfH = BAR_H[index] * RADIUS * 0.72;
    return `<rect x="${(px - BAR_HALF_W).toFixed(2)}" y="${(CENTER - halfH).toFixed(2)}" width="${(BAR_HALF_W * 2).toFixed(2)}" height="${(halfH * 2).toFixed(2)}" fill="url(#vz-icon-bar)"/>`;
  }).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${SIZE} ${SIZE}">
  <defs>
    <radialGradient id="vz-icon-glow" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#102742"/>
      <stop offset="100%" stop-color="#060b14"/>
    </radialGradient>
    <linearGradient id="vz-icon-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ed7f2"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="7" y="7" width="${SIZE - 14}" height="${SIZE - 14}" rx="${CORNER}" fill="url(#vz-icon-glow)" stroke="#1aa3d8" stroke-width="9"/>
  ${barRects}
</svg>`;
}

const esc = (value) =>
  String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');

const icon = (name, cls = '') =>
  `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.wave}</svg>`;

const pct = (value, total) => (total > 0 ? Math.round((value / total) * 100) : 0);

function fmtTime(seconds) {
  const s = Math.max(0, Number(seconds) || 0);
  const m = Math.floor(s / 60);
  const r = s - m * 60;
  return `${String(m).padStart(2, '0')}:${r.toFixed(1).padStart(4, '0')}`;
}

function fmtDuration(seconds) {
  const s = Math.round(Number(seconds) || 0);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h > 0) return `${h} h ${String(m).padStart(2, '0')} min`;
  return `${m} min ${String(s % 60).padStart(2, '0')} s`;
}

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

/* ------------------------------ toasts en vivo ----------------------------- */
let toastSeq = 0;

function createToasts() {
  const items = [];
  // El contenedor se resuelve en cada pintado: al crear el store todavia no existe
  // #toasts en el DOM y usar document.body borraria toda la aplicacion.
  const container = () => (typeof document !== 'undefined' ? document.getElementById('toasts') : null);

  function render() {
    const el = container();
    if (!el) return;
    el.innerHTML = items
      .map(
        (toast) => `<div class="toast ${toast.kind}" role="status">
          <span class="toast-icon">${icon(toast.kind === 'danger' ? 'alert' : toast.kind === 'warn' ? 'info' : 'check', 'sm')}</span>
          <div class="toast-body"><strong>${esc(toast.title)}</strong>${toast.detail ? `<span>${esc(toast.detail)}</span>` : ''}</div>
          <button class="toast-x" data-toast="${toast.id}" aria-label="Cerrar aviso">${icon('x', 'sm')}</button>
        </div>`,
      )
      .join('');
  }

  function push(title, detail = '', kind = 'ok') {
    const id = `t${++toastSeq}`;
    items.push({ id, title, detail, kind });
    render();
    return id;
  }

  function drop(id) {
    const index = items.findIndex((toast) => toast.id === id);
    if (index >= 0) items.splice(index, 1);
    render();
  }

  return { push, drop, items, render };
}

/* ------------------------------- paginacion -------------------------------- */
function paginate(items, page, perPage) {
  const total = Math.max(1, Math.ceil(items.length / perPage));
  const safe = clamp(page, 0, total - 1);
  return {
    slice: items.slice(safe * perPage, safe * perPage + perPage),
    page: safe,
    total,
    from: items.length === 0 ? 0 : safe * perPage + 1,
    to: Math.min(items.length, safe * perPage + perPage),
    count: items.length,
  };
}

function pager(id, info, action) {
  if (info.total <= 1) {
    return `<div class="pager"><span class="tiny muted">${info.count} ${info.count === 1 ? 'resultado' : 'resultados'}</span></div>`;
  }
  return `<div class="pager">
    <span class="tiny muted">${info.from}-${info.to} de ${info.count}</span>
    <div class="row">
      <button class="btn sm icon-only" data-action="${action}" data-page="${info.page - 1}" ${info.page === 0 ? 'disabled' : ''} aria-label="Pagina anterior">${icon('arrowLeft', 'sm')}</button>
      <span class="tiny mono dim">${info.page + 1} / ${info.total}</span>
      <button class="btn sm icon-only" data-action="${action}" data-page="${info.page + 1}" ${info.page >= info.total - 1 ? 'disabled' : ''} aria-label="Pagina siguiente">${icon('arrow', 'sm')}</button>
    </div>
  </div>`;
}

/* ------------------------------- carrusel -------------------------------- */
/*

  desplazando. Se mueve con los botones, la rueda, el arrastre del raton y el

function carrusel({ id, items, porVista, cols = 4, etiqueta = 'tarjetas' }) {
  const paginas = Math.ceil(items.length / porVista);
  const filas = Math.ceil(porVista / cols);

  const nav = `<footer class="tray-nav">
      <span class="tray-count"><b data-tray-page>1</b> / <b>${paginas || 1}</b> <span class="dim">·</span> ${items.length} ${esc(etiqueta)}</span>
      ${
        hayMas
          ? `<div class="tray-buttons">
              <button class="btn sm icon-only tray-arrow prev" data-action="tray:prev" data-tray="${id}" aria-label="Ver ${etiqueta} anteriores" disabled>${icon('arrowLeft', 'sm')}</button>
              <button class="btn sm icon-only tray-arrow next" data-action="tray:next" data-tray="${id}" aria-label="Ver mas ${etiqueta}">${icon('arrow', 'sm')}</button>
            </div>`
          : ''

  return `<div class="tray" data-tray-id="${id}" data-tray-visible="${porVista}" data-tray-cols="${cols}" data-tray-total="${items.length}" data-tray-pages="${paginas || 1}">

      style="--tray-cols:${cols};--tray-rows:${filas}">${items.join('')}</div>
    ${nav}
  </div>`;
}

/* ------------------------------ desplazamiento ---------------------------- */
/*
  Una sola implementacion para todas las bandejas: mide la pagina con el ancho
  real de las tarjetas, asi que el tamano de la ventana no importa.
*/
function trayStep(tray) {
  const viewport = tray.querySelector('.tray-viewport');
  const cards = tray.querySelectorAll('.tray-viewport > *');
  if (!viewport || !cards.length) return { step: 0, page: 1, pages: 1 };
  const cols = Number(tray.dataset.trayCols) || 4;
  const pages = Number(tray.dataset.trayPages) || 1;

  // Una pagina = el ancho de la primera columna multiplicado por las columnas,
  // mas los huecos entre ellas.
  const ancho = cards[0].getBoundingClientRect().width;
  const estilo = window.getComputedStyle ? window.getComputedStyle(viewport) : null;
  const hueco = parseFloat(estilo?.columnGap || estilo?.gap || '0') || 0;
  let step = ancho > 0 ? cols * ancho + (cols - 1) * hueco : 0;
  if (!step) step = viewport.clientWidth; // sin motor de layout: una pagina entera

  const max = Math.max(0, viewport.scrollWidth - viewport.clientWidth);
  const page = step > 0 ? Math.min(pages, Math.round(viewport.scrollLeft / step) + 1) : 1;
  return { step, max, page, pages };
}

function syncTrays(root = document) {
  root.querySelectorAll('[data-tray-id]').forEach((tray) => {
    const viewport = tray.querySelector('.tray-viewport');
    if (!viewport) return;
    const prev = tray.querySelector('.tray-arrow.prev');
    const next = tray.querySelector('.tray-arrow.next');
    const max = viewport.scrollWidth - viewport.clientWidth;
    const { page } = trayStep(tray);
    // Sin motor de layout no se puede medir: no se apaga nada, o la flecha
    // quedaria muerta para siempre en un render temprano.
    if (prev) prev.disabled = viewport.scrollLeft <= 2;
    if (next) next.disabled = max > 0 ? viewport.scrollLeft >= max - 2 : false;
    const contador = tray.querySelector('[data-tray-page]');
    if (contador) contador.textContent = String(viewport.scrollLeft <= 2 ? 1 : page);
    tray.dataset.trayPage = String(page || 1);
  });
}

function moveTray(id, direction, root = document) {
  const tray = root.querySelector(`[data-tray-id="${id}"]`);
  if (!tray) return;
  const viewport = tray.querySelector('.tray-viewport');
  if (!viewport) return;
  const { step, max } = trayStep(tray);
  const destino = Math.max(0, Math.min(max, viewport.scrollLeft + direction * step));
  // Si el navegador no anima (o no hay layout), al menos se coloca en el destino.
  if (typeof viewport.scrollTo === 'function') viewport.scrollTo({ left: destino, behavior: 'smooth' });
  else viewport.scrollLeft = destino;
  // El estado de las flechas se actualiza ya; se repasa al acabar la animacion.
  syncTrays(root);
  window.setTimeout(() => syncTrays(root), 340);
}

/* ------------------------- arrastre con raton y dedo ---------------------- */
function attachTrayDrag(root = document) {
  if (root.__trayDragAttached) return;
  root.__trayDragAttached = true;

  let drag = null;

  const inicio = (event) => {
    const tray = event.target.closest?.('[data-tray-id]');
    const viewport = tray?.querySelector('.tray-viewport');
    if (!viewport) return;
    // En tactil manda el desplazamiento nativo del navegador.
    if (event.pointerType === 'touch') return;
    if (event.target.closest('button') && !event.target.closest('.tray-arrow')) return;
    drag = { viewport, x: event.clientX, left: viewport.scrollLeft, movido: false, tray };
    viewport.classList.add('dragging');
  };

  const mover = (event) => {
    if (!drag || event.pointerType === 'touch') return;
    const delta = event.clientX - drag.x;
    if (Math.abs(delta) > 4) drag.movido = true;
    drag.viewport.scrollLeft = drag.left - delta;
    if (drag.movido) event.preventDefault();
  };

  const soltar = () => {
    if (!drag) return;
    drag.viewport.classList.remove('dragging');
    const { tray } = drag;
    drag = null;
    syncTrays(tray.parentElement || root);
  };

  root.addEventListener('pointerdown', inicio, { passive: true });
  root.addEventListener('pointermove', mover, { passive: false });
  root.addEventListener('pointerup', soltar);
  root.addEventListener('pointercancel', soltar);
  root.addEventListener('pointerleave', soltar);

  // Un arrastre no debe acabar en clic sobre la tarjeta.
  root.addEventListener('click', (event) => {
    if (event.target.closest('.tray-viewport.dragging')) event.preventDefault();
  }, true);

  // Rueda vertical u horizontal sobre la bandeja: mueve la bandeja, no la pagina.
  root.addEventListener('wheel', (event) => {
    const viewport = event.target.closest?.('[data-tray-id] .tray-viewport');
    if (!viewport) return;
    const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
    if (!delta) return;
    const max = viewport.scrollWidth - viewport.clientWidth;
    if (max <= 0) return;
    const antes = viewport.scrollLeft;
    if ((delta > 0 && antes < max - 1) || (delta < 0 && antes > 1)) {
      viewport.scrollLeft = antes + delta;
      event.preventDefault();
      syncTrays(viewport.closest('[data-tray-id]').parentElement || root);
    }
  }, { passive: false });

  root.addEventListener('scroll', (event) => {
    const viewport = event.target.closest?.('.tray-viewport');
    if (viewport) syncTrays(viewport.closest('[data-tray-id]').parentElement || root);
  }, true);

  // Con teclado: las flechas mueven la bandeja que tiene el foco.
  root.addEventListener('keydown', (event) => {
    const viewport = event.target.closest?.('.tray-viewport');
    if (!viewport) return;
    const tray = viewport.closest('[data-tray-id]');
    if (!tray) return;
    const { step } = trayStep(tray);
    if (event.key === 'ArrowRight') { viewport.scrollBy({ left: step, behavior: 'smooth' }); event.preventDefault(); }
    if (event.key === 'ArrowLeft') { viewport.scrollBy({ left: -step, behavior: 'smooth' }); event.preventDefault(); }
  });
}

function playerBlock() {
  const id = state.player.blockId || state.blockId;
  return findBlock(id) || allBlocks()[0];
}

function startPlayer(blockId) {
  const block = findBlock(blockId);
  if (!block) return;
  stopPlayer();
  const take = chosenTake(block);
  state.player = {
    ...state.player,
    blockId,
    playing: true,
    pos: 0,
    dur: take ? take.duration : 2,
    timer: setInterval(() => {
      if (!state.player.playing) return;
      state.player.pos = Math.min(state.player.dur, state.player.pos + 0.2);
      if (state.player.pos >= state.player.dur) {
        stopPlayer();
        notify('Fin del bloque', `${block.id} · ${fmtTime(state.player.dur)}`, 'ok');
      }
      paintPlayer();
    }, 200),
  };
  paintPlayer();
}

function stopPlayer() {
  if (state.player.timer) clearInterval(state.player.timer);
  state.player.playing = false;
  state.player.timer = null;
}

function paintPlayer() {
  const block = playerBlock();
  const take = block ? chosenTake(block) : null;
  const playing = state.player.playing && state.player.blockId === (block ? block.id : null);
  $$('[data-player-bar]').forEach((node) => {
    const total = take ? take.duration : 1;
    const ratio = playing ? clamp(state.player.pos / total, 0, 1) : 0;
    node.style.setProperty('--pos', `${(ratio * 100).toFixed(1)}%`);
  });
  $$('[data-player-time]').forEach((node) => {
    node.textContent = playing ? `${fmtTime(state.player.pos)} / ${fmtTime(take ? take.duration : 0)}` : fmtTime(take ? take.duration : 0);
  });
  $$('[data-player-btn]').forEach((node) => {
    node.innerHTML = playing ? icon('pause', 'sm') : icon('play', 'sm');
    node.setAttribute('aria-label', playing ? 'Pausar' : 'Escuchar');
  });
}

/* ---------------------------------- cola ---------------------------------- */
function queueTotal() {
  return state.jobs.reduce((acc, job) => acc + (job.total || 0), 0);
}
function queueDone() {
  return state.jobs.reduce((acc, job) => acc + ((job.state === 'listo' ? job.total : job.progress) || 0), 0);
}
/** Trabajos ya cerrados, los ultimos primero: se ven al desplegar la cola. */
function queueHistory() {
  return (state.queueHistory || []).slice(-12).reverse();
}
function enqueueRender(doc, mode, blocks) {
  if (!doc) return;
  const total = blocks && blocks.length ? blocks.length : doc.blocks.filter((b) => b.state !== 'aprobado' || mode === 'final').length;
  const job = {
    id: `job-${Date.now()}`,
    kind: 'render',
    title: `${doc.title.split(' - ')[0]} · ${total} bloques`,
    detail: `${engineById(mode === 'draft' ? 'piper' : project().cast?.[0]?.voiceId ? catalogVoice(project().cast[0].voiceId)?.engine || 'kokoro' : 'kokoro').name} · ${mode === 'draft' ? 'borrador' : 'final'}`,
    state: 'pendiente',
    progress: 0,
    total,
  };
  state.jobs.push(job);
  notify('Trabajo en cola', `${job.title} · ${job.detail}`, 'ok');
  if (!state.queueRunning) runQueue();
}

function runQueue() {
  state.queueRunning = true;
  if (state.queueTimer) clearInterval(state.queueTimer);
  state.queueTimer = setInterval(() => {
    const job = state.jobs.find((item) => item.state === 'pendiente' || item.state === 'ejecutando');
    if (!job) {
      state.queueRunning = false;
      clearInterval(state.queueTimer);
      state.queueTimer = null;
      renderQueue();
      return;
    }
    job.state = 'ejecutando';
    job.progress = Math.min(job.total, job.progress + Math.max(1, Math.round(job.total / 12)));
    if (job.progress >= job.total) {
      job.state = 'listo';
      applyJobResult(job);
    }
    renderQueue();
    if (state.route === 'produce') paintProduceCounters();
  }, 420);
}

function applyJobResult(job) {
  if (!job.blocks) return;
  job.blocks.forEach((blockId) => {
    const block = findBlock(blockId);
    if (block) {
      block.state = 'revisar';
      block.takes = block.takes.map((take) => ({ ...take }));
    }
  });
  notify('Documento renderizado', `${job.title} · listo para tu escucha`, 'ok');
}

function lecturaStats() {
  const lectura = state.lectura;
  const base = readPresetById(lectura.preset);
  // Los ajustes propios mandan; si no se han tocado, se usan los del preset.
  const preset = {
    ...base,
    speed: lectura.speed ?? base.speed,
    pause: lectura.pause ?? base.pause,
    chunk: lectura.chunk ?? base.chunk,
    emotion: lectura.emotion ?? base.emotion,
  };
  const engine = engineById(lectura.engine) || engineById('kokoro');
  const chunks = Math.max(1, Math.ceil(lectura.text.length / preset.chunk));
  const est = estimateRead(lectura.text.length, engine.rtf, chunks);
  return { text: lectura.text, preset, engine, chunks, est, chars: lectura.text.length, words: lectura.text.trim() ? lectura.text.trim().split(/\s+/).length : 0 };
}

/* Auditoria de la biblioteca de 1.110: se calcula una vez al cargar. */
const PROMPT_AUDIT = (() => {
  let mejorables = 0;
  let completos = 0;
  let suma = 0;
  PROMPT_LIBRARY.forEach((item) => {
    const audit = auditPrompt(item.text, item.mode);
    suma += audit.puntos;
    if (audit.hallazgos.length) mejorables += 1;
    else completos += 1;
  });
  return { mejorables, completos, media: Math.round(suma / Math.max(1, PROMPT_LIBRARY.length)) };
})();

/*
  Estos dos no llaman a render(): reemplazar el panel destruiria el input que
  tiene el foco. Solo actualizan las piezas que cambian.
*/
function syncQwenCompiled() {
  const q = state.qwen;
  const pre = $('.qwen-instruction');
  if (pre) pre.textContent = compileProfile(q.profile, q.master);
  const cobertura = profileCoverage(q.profile);
  const barra = $('.qwen-bar i');
  if (barra) barra.style.width = `${cobertura.pct}%`;
  const etiqueta = $('.qwen-matrix .tiny.dim');
  if (etiqueta) etiqueta.textContent = `${cobertura.pct} % cubierto`;
  const badge = $('.qwen-head .badge:nth-of-type(2)');
  if (badge) badge.textContent = `${cobertura.done} / ${cobertura.total} campos`;
  const partes = profileParts(q.profile);
  $$('.qwen-parts > div').forEach((div) => {
    const key = div.querySelector('span').textContent.toLowerCase();
    const mapa = { identidad: 'identity', timbre: 'timbre', entrega: 'delivery', grabacion: 'recording' };
    const b = div.querySelector('b');
    if (b && mapa[key]) b.textContent = partes[mapa[key]];
  });
}
