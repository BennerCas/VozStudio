    <style>
/* VozStudio Atlas - prototipo visual
   Tokens semanticos + componentes. Sin dependencias, sin red. */

/* ---------------------------------- tokens --------------------------------- */
:root {
  color-scheme: dark;
  --font-ui: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", "Consolas", ui-monospace, monospace;

  /* Escala tipografica ampliada: minimo legible de 12 px, como pide la propuesta (15.6).
     La densidad se mantiene con interlineado 1.42 y espacio vertical, no reduciendo letra. */
  --text-xs: 12px;
  --text-sm: 13px;
  --text-md: 15px;
  --text-lg: 17px;
  --text-xl: 20px;
  --text-2xl: 25px;
  --text-3xl: 32px;
  --text-4xl: 38px;

  --radius-sm: 6px;
  --radius-md: 9px;
  --radius-lg: 13px;
  --radius-xl: 18px;

  --space-1: 4px;
  --space-2: 7px;
  --space-3: 10px;
  --space-4: 14px;
  --space-5: 18px;
  --space-6: 24px;
  --space-7: 32px;

  --sidebar: 248px;
  --topbar: 62px;
  --footer: 32px;

  --bg: #070c10;
  --bg-deep: #04080b;
  --surface: #0b1319;
  --surface-2: #0e1a21;
  --surface-3: #12222b;
  --surface-raised: #162a34;
  --line: rgba(150, 196, 206, 0.13);
  --line-strong: rgba(150, 196, 206, 0.24);

  --text: #e7f1f3;
  --text-2: #a7bcc1;
  --text-3: #7b9197;
  --text-4: #5d7377;

  --accent: #22d3ee;
  --accent-soft: rgba(34, 211, 238, 0.12);
  --accent-line: rgba(34, 211, 238, 0.34);
  --accent-ink: #04141a;

  --ok: #34d399;
  --ok-soft: rgba(52, 211, 153, 0.12);
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, 0.12);
  --danger: #fb7185;
  --danger-soft: rgba(251, 113, 133, 0.12);
  --info: #a78bfa;
  --info-soft: rgba(167, 139, 250, 0.12);
  --amber: #f0b34a;

  --shadow-panel: 0 18px 40px rgba(0, 0, 0, 0.28);
  --shadow-pop: 0 24px 60px rgba(0, 0, 0, 0.45);

  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

.shell[data-theme="grafito"] {
  --bg: #0b0c0e;
  --bg-deep: #07080a;
  --surface: #121417;
  --surface-2: #171a1e;
  --surface-3: #1d2126;
  --surface-raised: #24282e;
  --line: rgba(210, 220, 226, 0.12);
  --line-strong: rgba(210, 220, 226, 0.22);
  --text: #eceff2;
  --text-2: #b0b8bf;
  --text-3: #868f97;
  --text-4: #6a737b;
  --accent: #d7e2e8;
  --accent-soft: rgba(215, 226, 232, 0.1);
  --accent-line: rgba(215, 226, 232, 0.3);
  --accent-ink: #111417;
  --amber: #d9b46a;
}

.shell[data-theme="ambar"] {
  --bg: #0d0a08;
  --bg-deep: #080605;
  --surface: #17110d;
  --surface-2: #1e1610;
  --surface-3: #261c15;
  --surface-raised: #2f231a;
  --line: rgba(240, 190, 140, 0.13);
  --line-strong: rgba(240, 190, 140, 0.24);
  --text: #f6ece2;
  --text-2: #cbb4a2;
  --text-3: #9d8676;
  --text-4: #7d6a5c;
  --accent: #f0b34a;
  --accent-soft: rgba(240, 179, 74, 0.12);
  --accent-line: rgba(240, 179, 74, 0.34);
  --accent-ink: #1a1105;
}

.shell[data-theme="claro"] {
  color-scheme: light;
  --bg: #eef3f5;
  --bg-deep: #e4ebee;
  --surface: #ffffff;
  --surface-2: #f6fafb;
  --surface-3: #eef4f6;
  --surface-raised: #ffffff;
  --line: rgba(24, 62, 70, 0.14);
  --line-strong: rgba(24, 62, 70, 0.24);
  --text: #10262b;
  --text-2: #3f575c;
  --text-3: #465b60;
  --text-4: #61787c;
  --accent: #0a6270;
  --accent-soft: rgba(10, 98, 112, 0.12);
  --accent-line: rgba(10, 98, 112, 0.34);
  --accent-ink: #ffffff;
  --ok: #0f9d76;
  --warn: #b47d09;
  --danger: #d0445b;
  --shadow-panel: 0 14px 30px rgba(16, 44, 50, 0.09);
  --shadow-pop: 0 24px 60px rgba(16, 44, 50, 0.18);
}

/* Negro AMOLED: negro puro para paneles OLED, sin superficies grises intermedias.
   Se mantiene el contraste AA sobre #000 y el cian como unico acento luminoso. */
.shell[data-theme="amoled"] {
  color-scheme: dark;
  --bg: #000000;
  --bg-deep: #000000;
  --surface: #000000;
  --surface-2: #070707;
  --surface-3: #0d0d0d;
  --surface-raised: #141414;
  --line: rgba(255, 255, 255, 0.12);
  --line-strong: rgba(255, 255, 255, 0.22);
  --text: #f2f7f8;
  --text-2: #b9c6c9;
  --text-3: #8b9a9d;
  --text-4: #6b7a7d;
  --accent: #00f0ff;
  --accent-soft: rgba(0, 240, 255, 0.1);
  --accent-line: rgba(0, 240, 255, 0.34);
  --accent-ink: #001417;
  --ok: #2ee6a8;
  --warn: #ffc400;
  --danger: #ff5f7a;
  --info: #b79bff;
  --amber: #ffc400;
  --shadow-panel: none;
  --shadow-pop: 0 24px 60px rgba(0, 0, 0, 0.9);
  background: #000;
}
.shell[data-theme="amoled"] .shell,
.shell[data-theme="amoled"] .main,
.shell[data-theme="amoled"] .panel,
.shell[data-theme="amoled"] .card,
.shell[data-theme="amoled"] .topbar {
  background-color: #000;
}
.shell[data-theme="amoled"] .sidebar {
  background: linear-gradient(180deg, #000 0%, #000 100%);
  border-right-color: rgba(0, 240, 255, 0.14);
}
.shell[data-theme="amoled"] .panel {
  border-color: rgba(255, 255, 255, 0.1);
}


/* ---------------------------------- base ---------------------------------- */
* {
  box-sizing: border-box;
  scrollbar-width: thin;
  scrollbar-color: var(--surface-raised) transparent;
}
*::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}
*::-webkit-scrollbar-thumb {
  background: var(--surface-raised);
  border-radius: 99px;
  border: 2px solid transparent;
  background-clip: content-box;
}
*::-webkit-scrollbar-track {
  background: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
}
body {
  background: var(--bg-deep);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--text-md);
  line-height: 1.42;
  -webkit-font-smoothing: antialiased;
}
h1,
h2,
h3,
h4,
p,
ul,
ol {
  margin: 0;
}
ul,
ol {
  padding: 0;
  list-style: none;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}
input,
textarea,
select {
  font: inherit;
  color: inherit;
}
a {
  color: var(--accent);
  text-decoration: none;
}
strong {
  font-weight: 650;
}
em {
  font-style: normal;
}
kbd {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-3);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 5px;
  background: var(--surface-2);
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}
.mono {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.01em;
}
.muted {
  color: var(--text-3);
}
.dim {
  color: var(--text-4);
}
.truncate {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.icon {
  width: 16px;
  height: 16px;
  flex: none;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.icon.sm {
  width: 14px;
  height: 14px;
}
.icon.lg {
  width: 20px;
  height: 20px;
}
.icon.hero {
  width: 26px;
  height: 26px;
  stroke-width: 1.5;
}

/* ---------------------------------- shell --------------------------------- */
/* Escala tipografica en tiempo real: multiplica todos los tokens sin tocar margenes.
   El valor llega por data-font-scale desde app.js (no por style, que innerHTML borra). */
.shell {
  --font-scale: 1;
  --text-xs: calc(12px * var(--font-scale));
  --text-sm: calc(13px * var(--font-scale));
  --text-md: calc(15px * var(--font-scale));
  --text-lg: calc(17px * var(--font-scale));
  --text-xl: calc(20px * var(--font-scale));
  --text-2xl: calc(25px * var(--font-scale));
  --text-3xl: calc(32px * var(--font-scale));
  --text-4xl: calc(38px * var(--font-scale));
}
.shell[data-font-scale="0.9"] { --font-scale: 0.9; }
.shell[data-font-scale="0.95"] { --font-scale: 0.95; }
.shell[data-font-scale="1"] { --font-scale: 1; }
.shell[data-font-scale="1.05"] { --font-scale: 1.05; }
.shell[data-font-scale="1.1"] { --font-scale: 1.1; }
.shell[data-font-scale="1.15"] { --font-scale: 1.15; }
.shell[data-font-scale="1.2"] { --font-scale: 1.2; }
.shell[data-font-scale="1.25"] { --font-scale: 1.25; }
.shell[data-font-scale="1.3"] { --font-scale: 1.3; }

.shell {
  display: grid;
  grid-template-columns: var(--sidebar) minmax(0, 1fr);
  min-height: 100vh;
  background: radial-gradient(1100px 500px at 78% -12%, var(--accent-soft), transparent 62%), var(--bg);
}

.sidebar {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-3) var(--space-3);
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 70%);
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 6px 2px;
}
.brand-mark {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 10px;
  border: 1px solid var(--accent-line);
  background: radial-gradient(circle at 50% 30%, var(--accent-soft), transparent 70%), var(--surface-2);
  color: var(--accent);
}
.brand-text strong {
  display: block;
  font-size: var(--text-lg);
  letter-spacing: -0.01em;
}
.brand-text span {
  display: block;
  font-size: var(--text-xs);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-label {
  font-size: var(--text-xs);
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--text-4);
  padding: 10px 8px 4px;
}
.nav button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 9px;
  border-radius: 8px;
  color: var(--text-2);
  font-size: var(--text-md);
  text-align: left;
  transition: background 0.16s var(--ease), color 0.16s var(--ease);
}
.nav button:hover {
  background: var(--surface-2);
  color: var(--text);
}
.nav button[aria-current="page"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
  box-shadow: inset 0 0 0 1px var(--accent-line);
}
.nav button .badge-x {
  margin-left: auto;
}

.sidebar-foot {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.health {
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface-2);
  padding: 9px 10px;
  display: grid;
  gap: 7px;
}
.health header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--text-xs);
  color: var(--text-3);
}
.health header strong {
  color: var(--ok);
  font-size: var(--text-xs);
}
.health-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 8px;
  font-size: var(--text-xs);
  color: var(--text-3);
}
.health-row b {
  color: var(--text-2);
  font-weight: 600;
}
.meter {
  grid-column: 1 / -1;
  height: 4px;
  border-radius: 99px;
  background: var(--surface-3);
  overflow: hidden;
}
.meter i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent), var(--ok));
}
.meter.warn i {
  background: linear-gradient(90deg, var(--warn), var(--danger));
}
.side-profile {
  display: flex;
  align-items: center;
  gap: 9px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 7px 9px;
  color: var(--text-2);
}
.avatar {
  width: 26px;
  height: 26px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 8px;
  font-size: var(--text-xs);
  font-weight: 700;
  color: var(--accent-ink);
  background: linear-gradient(135deg, var(--accent), var(--ok));
}
.side-profile strong {
  display: block;
  font-size: var(--text-sm);
  color: var(--text);
}
.side-profile small {
  font-size: var(--text-xs);
  color: var(--text-3);
}

.main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: var(--topbar);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 0 var(--space-5);
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(12px);
}
.topbar h1 {
  font-size: var(--text-lg);
  font-weight: 620;
  letter-spacing: -0.01em;
}
.topbar .crumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-sm);
  color: var(--text-3);
}
.topbar .crumbs b {
  color: var(--text);
  font-weight: 600;
}
.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.search {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--text-3);
  min-width: 240px;
  cursor: pointer;
}
.search span {
  font-size: var(--text-sm);
}
.search kbd {
  margin-left: auto;
}
.sys-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  font-size: var(--text-sm);
  color: var(--text-2);
  white-space: nowrap;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 99px;
  background: var(--ok);
  box-shadow: 0 0 0 3px var(--ok-soft);
  flex: none;
}
.dot.warn {
  background: var(--warn);
  box-shadow: 0 0 0 3px var(--warn-soft);
}
.dot.danger {
  background: var(--danger);
  box-shadow: 0 0 0 3px var(--danger-soft);
}
.dot.idle {
  background: var(--text-4);
  box-shadow: none;
}

.content {
  flex: 1;
  min-height: 0;
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

/* --------------------------------- elements -------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 34px;
  padding: 0 13px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: var(--text-md);
  font-weight: 550;
  white-space: nowrap;
  transition: background 0.15s var(--ease), color 0.15s var(--ease), border-color 0.15s var(--ease),
    transform 0.15s var(--ease);
}
.btn:hover {
  color: var(--text);
  border-color: var(--line-strong);
  background: var(--surface-3);
}
.btn:active {
  transform: translateY(1px);
}
.btn[disabled] {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 650;
}
.btn.primary:hover {
  background: color-mix(in srgb, var(--accent) 86%, #fff);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn.ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text-3);
}
.btn.ghost:hover {
  background: var(--surface-2);
  color: var(--text);
}
.btn.danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 34%, transparent);
  background: var(--danger-soft);
}
.btn.danger:hover {
  background: color-mix(in srgb, var(--danger) 20%, transparent);
  color: var(--danger);
}
.btn.sm {
  height: 27px;
  padding: 0 9px;
  font-size: var(--text-sm);
  border-radius: 7px;
}
.btn.lg {
  height: 40px;
  padding: 0 17px;
  font-size: var(--text-md);
  border-radius: 9px;
}
.btn.icon-only {
  width: 34px;
  padding: 0;
}
.btn.icon-only.sm {
  width: 27px;
}
.btn.active {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent);
}

.panel {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-panel);
  min-width: 0;
}
.panel-head {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 11px var(--space-4);
  border-bottom: 1px solid var(--line);
}
.panel-head h2 {
  font-size: var(--text-md);
  font-weight: 620;
}
.panel-head .eyebrow {
  font-size: var(--text-xs);
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--text-4);
}
.panel-head .spacer {
  margin-left: auto;
}
.panel-body {
  padding: var(--space-4);
}
.panel-body.tight {
  padding: var(--space-3);
}
.panel-body.flush {
  padding: 0;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 7px;
  border-radius: 5px;
  font-size: var(--text-xs);
  font-weight: 650;
  letter-spacing: 0.02em;
  border: 1px solid var(--line);
  color: var(--text-2);
  background: var(--surface-2);
  white-space: nowrap;
}
.badge.ok {
  color: var(--ok);
  border-color: color-mix(in srgb, var(--ok) 32%, transparent);
  background: var(--ok-soft);
}
.badge.warn {
  color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 32%, transparent);
  background: var(--warn-soft);
}
.badge.danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 32%, transparent);
  background: var(--danger-soft);
}
.badge.info {
  color: var(--info);
  border-color: color-mix(in srgb, var(--info) 32%, transparent);
  background: var(--info-soft);
}
.badge.accent {
  color: var(--accent);
  border-color: var(--accent-line);
  background: var(--accent-soft);
}
.badge-x {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 5px;
  display: inline-grid;
  place-items: center;
  font-size: var(--text-xs);
  font-weight: 700;
  color: var(--text-3);
  background: var(--surface-3);
}
.badge-x.accent {
  color: var(--accent);
  background: var(--accent-soft);
}

.seg {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface-2);
}
.seg button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 27px;
  padding: 0 11px;
  border-radius: 7px;
  font-size: var(--text-sm);
  font-weight: 550;
  color: var(--text-3);
}
.seg button:hover {
  color: var(--text);
}
.seg button[aria-pressed="true"],
.seg button.active {
  background: var(--surface-raised);
  color: var(--text);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
}
.seg button.primary[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
}

.field {
  display: grid;
  gap: 5px;
  font-size: var(--text-xs);
  color: var(--text-3);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 600;
}
.input,
.select,
.textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--text);
  padding: 7px 10px;
  font-size: var(--text-md);
  letter-spacing: normal;
  text-transform: none;
  font-weight: 400;
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
}
.input:hover,
.select:hover,
.textarea:hover {
  border-color: var(--line-strong);
}
.input:focus,
.select:focus,
.textarea:focus {
  outline: none;
  border-color: var(--accent-line);
  background: var(--surface-3);
}
.textarea {
  resize: vertical;
  line-height: 1.6;
  min-height: 84px;
}
.select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%),
    linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 30px;
}
.range {
  display: grid;
  gap: 6px;
}
.range-top {
  display: flex;
  justify-content: space-between;
  font-size: var(--text-xs);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-3);
  font-weight: 600;
}
.range-top b {
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
}
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 99px;
  background: var(--surface-3);
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 1px var(--accent-line);
  cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--surface);
  cursor: pointer;
}
.check {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--text-md);
  color: var(--text-2);
  cursor: pointer;
}
.check input {
  width: 15px;
  height: 15px;
  accent-color: var(--accent);
  cursor: pointer;
}

.toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  text-align: left;
}
.toggle:last-child {
  border-bottom: 0;
}
.toggle-text {
  flex: 1;
  min-width: 0;
}
.toggle-text strong {
  display: block;
  font-size: var(--text-md);
  font-weight: 550;
  color: var(--text);
}
.toggle-text small {
  display: block;
  font-size: var(--text-xs);
  color: var(--text-3);
}
.toggle-switch {
  width: 36px;
  height: 20px;
  border-radius: 99px;
  background: var(--surface-raised);
  border: 1px solid var(--line);
  position: relative;
  flex: none;
  transition: background 0.16s var(--ease);
}
.toggle-switch b {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 99px;
  background: var(--text-3);
  transition: transform 0.16s var(--ease), background 0.16s var(--ease);
}
.toggle-switch[aria-checked="true"] {
  background: var(--accent-soft);
  border-color: var(--accent-line);
}
.toggle-switch[aria-checked="true"] b {
  transform: translateX(15px);
  background: var(--accent);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  height: 26px;
  padding: 0 10px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text-3);
  font-size: var(--text-sm);
  transition: 0.15s var(--ease);
}
.chip:hover {
  color: var(--text);
  border-color: var(--line-strong);
}
.chip[aria-pressed="true"] {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: var(--accent);
}

.kv {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 5px 14px;
  font-size: var(--text-sm);
}
.kv dt {
  color: var(--text-3);
  white-space: nowrap;
}
.kv dd {
  margin: 0;
  color: var(--text-2);
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
}

.empty {
  display: grid;
  place-items: center;
  gap: 8px;
  padding: 26px 18px;
  text-align: center;
  color: var(--text-3);
  font-size: var(--text-sm);
}
.empty .icon {
  color: var(--text-4);
  width: 22px;
  height: 22px;
}
.empty strong {
  color: var(--text-2);
  font-size: var(--text-md);
}

.bar {
  height: 5px;
  border-radius: 99px;
  background: var(--surface-3);
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: var(--accent);
  transition: width 0.5s var(--ease);
}
.bar.ok i {
  background: var(--ok);
}
.bar.warn i {
  background: var(--warn);
}

.hr {
  height: 1px;
  background: var(--line);
  border: 0;
  margin: var(--space-3) 0;
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-sm);
}
.table th {
  text-align: left;
  font-size: var(--text-xs);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-4);
  font-weight: 650;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.table td {
  padding: 9px 10px;
  border-bottom: 1px solid var(--line);
  color: var(--text-2);
  vertical-align: middle;
}
.table tr:last-child td {
  border-bottom: 0;
}
.table tr:hover td {
  background: color-mix(in srgb, var(--surface-2) 60%, transparent);
}
.table .num {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-2);
  text-align: right;
  white-space: nowrap;
}

/* ---------------------------------- produce -------------------------------- */
.produce,
.produce-grid {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: 232px minmax(420px, 1fr) 296px;
  gap: var(--space-3);
  align-items: stretch;
}
.produce-col {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  overflow: hidden;
}
.produce-col > header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 11px;
  border-bottom: 1px solid var(--line);
  font-size: var(--text-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-4);
  font-weight: 650;
  flex: none;
}
.produce-col > header .spacer {
  margin-left: auto;
}
.produce-col .scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
.produce-col footer {
  flex: none;
  border-top: 1px solid var(--line);
  padding: 8px 11px;
}

.doc-list {
  display: grid;
  gap: 3px;
  padding: 8px;
}
.doc-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 4px 8px;
  width: 100%;
  padding: 7px 9px;
  border-radius: 8px;
  text-align: left;
  color: var(--text-2);
  border: 1px solid transparent;
}
.doc-item:hover {
  background: var(--surface-2);
}
.doc-item[aria-current="true"] {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--text);
}
.doc-item strong {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: var(--text-md);
  font-weight: 570;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.doc-item small {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--text-xs);
  color: var(--text-3);
}
.doc-progress {
  grid-column: 1 / -1;
  height: 3px;
  border-radius: 99px;
  background: var(--surface-3);
  overflow: hidden;
  margin-top: 2px;
}
.doc-progress i {
  display: block;
  height: 100%;
  background: var(--ok);
  border-radius: 99px;
}

.blocks {
  display: grid;
  gap: 6px;
  padding: 8px;
}
.block {
  position: relative;
  display: grid;
  gap: 6px;
  padding: 9px 10px 9px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface-2);
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
}
.block::before {
  content: "";
  position: absolute;
  left: 0;
  top: 8px;
  bottom: 8px;
  width: 3px;
  border-radius: 99px;
  background: var(--text-4);
}
.block[data-state="aprobado"]::before {
  background: var(--ok);
}
.block[data-state="revisar"]::before {
  background: var(--warn);
}
.block[data-state="error"]::before {
  background: var(--danger);
}
.block[data-state="pendiente"]::before {
  background: var(--text-4);
  opacity: 0.5;
}
.block[aria-current="true"] {
  border-color: var(--accent-line);
  background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface-2));
}
.block:hover {
  border-color: var(--line-strong);
}
.block-top {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--text-xs);
  color: var(--text-4);
  font-family: var(--font-mono);
}
.block-top .role {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--text-2);
  font-family: var(--font-ui);
  font-size: var(--text-xs);
  font-weight: 650;
  letter-spacing: 0.05em;
}
.block-top .role i {
  width: 6px;
  height: 6px;
  border-radius: 99px;
  background: var(--role, var(--accent));
}
.block-text {
  font-size: var(--text-md);
  color: var(--text);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.block-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: var(--text-xs);
  color: var(--text-3);
  font-family: var(--font-mono);
}
.block-actions {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-left: auto;
}

.editor {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  overflow-y: auto;
  min-height: 0;
}
.editor-head {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
}
.editor-text {
  width: 100%;
  min-height: 150px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text);
  padding: 12px 14px;
  font-size: var(--text-lg);
  line-height: 1.65;
  resize: vertical;
}
.editor-text:focus {
  outline: none;
  border-color: var(--accent-line);
  background: var(--surface-3);
}
.editor-tools {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}
.norm-preview {
  border: 1px dashed var(--line-strong);
  border-radius: 9px;
  padding: 9px 11px;
  background: color-mix(in srgb, var(--info-soft) 55%, transparent);
  font-size: var(--text-sm);
  color: var(--text-2);
  line-height: 1.55;
}
.norm-preview b {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--info);
  font-size: var(--text-xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.controls-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: var(--space-3);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: var(--space-3);
  background: var(--surface-2);
}
.takes {
  display: grid;
  gap: 5px;
}
.takes-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--text-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-4);
  font-weight: 650;
}
.take {
  display: grid;
  grid-template-columns: auto 1fr auto auto auto;
  align-items: center;
  gap: 9px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  font-size: var(--text-sm);
}
.take[data-chosen="true"] {
  border-color: color-mix(in srgb, var(--ok) 34%, transparent);
  background: color-mix(in srgb, var(--ok-soft) 50%, var(--surface-2));
}
.take .tag {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-4);
}
.take .meta {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-3);
  white-space: nowrap;
}

.qa-list {
  display: grid;
  gap: 5px;
}
.qa-row {
  display: grid;
  grid-template-columns: 16px 1fr auto;
  align-items: center;
  gap: 8px;
  font-size: var(--text-sm);
  padding: 5px 0;
  border-bottom: 1px solid var(--line);
  color: var(--text-2);
}
.qa-row:last-child {
  border-bottom: 0;
}
.qa-row .icon {
  width: 14px;
  height: 14px;
}
.qa-row.ok .icon {
  color: var(--ok);
}
.qa-row.warn .icon {
  color: var(--warn);
}
.qa-row.bad .icon {
  color: var(--danger);
}
.qa-row b {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-3);
  font-weight: 500;
}

/* player */
.player {
  display: grid;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
}
.player-top {
  display: flex;
  align-items: center;
  gap: 9px;
}
.play-btn {
  width: 36px;
  height: 36px;
  border-radius: 99px;
  display: grid;
  place-items: center;
  background: var(--accent);
  color: var(--accent-ink);
  flex: none;
  transition: transform 0.15s var(--ease);
}
.play-btn:hover {
  transform: scale(1.04);
}
.play-btn svg {
  width: 17px;
  height: 17px;
}
.wave {
  flex: 1;
  min-width: 0;
  height: 40px;
  display: flex;
  align-items: center;
  gap: 2px;
  cursor: pointer;
}
.wave span {
  flex: 1;
  min-width: 1px;
  border-radius: 99px;
  background: var(--surface-raised);
  transition: background 0.12s linear;
}
.wave span.on {
  background: var(--accent);
}
.time {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-3);
  white-space: nowrap;
}
.player-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: var(--text-xs);
  color: var(--text-3);
}
.player-foot .vol {
  width: 84px;
}

/* queue */
.queue {
  display: grid;
  gap: 6px;
  padding: 8px;
}
.queue-row {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  align-items: center;
  gap: 9px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  font-size: var(--text-sm);
}
.queue-row[data-state="ejecutando"] {
  border-color: var(--accent-line);
  background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface-2));
}
.queue-row strong {
  display: block;
  font-size: var(--text-sm);
  font-weight: 570;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.queue-row small {
  display: block;
  font-size: var(--text-xs);
  color: var(--text-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.queue-row .spin {
  width: 14px;
  height: 14px;
  border-radius: 99px;
  border: 2px solid var(--accent-line);
  border-top-color: var(--accent);
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.queue-foot {
  display: grid;
  gap: 6px;
  padding: 0 10px 10px;
}
.queue-foot .bar {
  height: 4px;
}

/* ---------------------------------- cards ---------------------------------- */
.grid-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
  gap: var(--space-3);
}
.card {
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: var(--space-4);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  transition: border-color 0.16s var(--ease), transform 0.16s var(--ease);
  text-align: left;
}
.card.interactive {
  cursor: pointer;
}
.card.interactive:hover {
  border-color: var(--line-strong);
  transform: translateY(-2px);
}
.card.recipe {
  position: relative;
  overflow: hidden;
}
.card.recipe::after {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--tone, var(--accent));
}
.card-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.card-icon {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 9px;
  color: var(--tone, var(--accent));
  background: color-mix(in srgb, var(--tone, var(--accent)) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--tone, var(--accent)) 26%, transparent);
}
.card h3 {
  font-size: var(--text-md);
  font-weight: 620;
  letter-spacing: -0.01em;
}
.card p {
  font-size: var(--text-sm);
  color: var(--text-3);
  line-height: 1.5;
}
.card-foot {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: auto;
  padding-top: 4px;
}
.spec-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px 12px;
  font-size: var(--text-xs);
}
.spec-row div {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: var(--text-3);
  min-width: 0;
}
.spec-row b {
  color: var(--text-2);
  font-weight: 550;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* voice rows */
.voice-row {
  display: grid;
  grid-template-columns: 20px 1fr auto auto auto;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  font-size: var(--text-sm);
}
.voice-row strong {
  display: block;
  font-size: var(--text-md);
  font-weight: 550;
}
.voice-row small {
  display: block;
  font-size: var(--text-xs);
  color: var(--text-3);
}
.voice-row .roll {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-4);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.voice-dot {
  width: 9px;
  height: 9px;
  border-radius: 99px;
  background: var(--role, var(--accent));
}

/* ------------------------------- auxiliary ui ------------------------------ */
.toolbar {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}
.toolbar .spacer {
  margin-left: auto;
}
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--space-3);
}
.stat {
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  padding: 11px 13px;
  display: grid;
  gap: 3px;
}
.stat span {
  font-size: var(--text-xs);
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--text-4);
  font-weight: 650;
}
.stat strong {
  font-size: var(--text-2xl);
  font-weight: 640;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.stat small {
  font-size: var(--text-xs);
  color: var(--text-3);
}
.stat.accent strong {
  color: var(--accent);
}
.stat.ok strong {
  color: var(--ok);
}
.stat.warn strong {
  color: var(--warn);
}

.two-col {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  gap: var(--space-3);
  align-items: start;
}
.three-col {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-3);
  align-items: start;
}

.dropzone {
  display: grid;
  place-items: center;
  gap: 7px;
  padding: 22px;
  border: 1.5px dashed var(--line-strong);
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--surface-2) 60%, transparent);
  color: var(--text-3);
  text-align: center;
  transition: 0.16s var(--ease);
}
.dropzone:hover,
.dropzone[data-over="true"] {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: var(--text-2);
}
.dropzone strong {
  color: var(--text);
  font-size: var(--text-md);
}
.dropzone small {
  font-size: var(--text-xs);
}

.license-cell {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: var(--text-xs);
  color: var(--text-3);
  font-family: var(--font-mono);
}
.license-cell.ok {
  color: var(--ok);
}
.license-cell.no {
  color: var(--danger);
}

/* --------------------------------- overlays -------------------------------- */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(3, 8, 10, 0.62);
  backdrop-filter: blur(3px);
  border: 0;
  animation: fade 0.15s var(--ease);
}
@keyframes fade {
  from {
    opacity: 0;
  }
}
.modal {
  position: fixed;
  z-index: 61;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 40px));
  max-height: calc(100vh - 60px);
  overflow-y: auto;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-xl);
  background: var(--surface);
  box-shadow: var(--shadow-pop);
  animation: pop 0.18s var(--ease);
}
.modal.wide {
  width: min(820px, calc(100vw - 40px));
}
@keyframes pop {
  from {
    opacity: 0;
    transform: translate(-50%, -48%) scale(0.985);
  }
}
.modal-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px var(--space-5);
  border-bottom: 1px solid var(--line);
}
.modal-head h2 {
  font-size: var(--text-lg);
  font-weight: 620;
}
.modal-body {
  padding: var(--space-5);
  display: grid;
  gap: var(--space-4);
}
.modal-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: flex-end;
  padding: 12px var(--space-5);
  border-top: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: 0 0 var(--radius-xl) var(--radius-xl);
}
.toasts {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 70;
  display: grid;
  gap: 7px;
  width: min(370px, calc(100vw - 36px));
}
.toast {
  display: grid;
  grid-template-columns: 16px 1fr auto;
  align-items: start;
  gap: 9px;
  padding: 10px 11px;
  border-radius: 10px;
  border: 1px solid var(--line-strong);
  background: var(--surface-raised);
  box-shadow: var(--shadow-pop);
  font-size: var(--text-sm);
  color: var(--text-2);
  animation: slidein 0.2s var(--ease);
}
@keyframes slidein {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}
.toast b {
  display: block;
  color: var(--text);
  font-size: var(--text-sm);
  font-weight: 600;
}
.toast.ok {
  border-color: color-mix(in srgb, var(--ok) 36%, transparent);
}
.toast.ok > .icon {
  color: var(--ok);
}
.toast.warn {
  border-color: color-mix(in srgb, var(--warn) 36%, transparent);
}
.toast.warn > .icon {
  color: var(--warn);
}
.toast.danger {
  border-color: color-mix(in srgb, var(--danger) 36%, transparent);
}
.toast.danger > .icon {
  color: var(--danger);
}
.toast button {
  color: var(--text-4);
}
.toast button:hover {
  color: var(--text);
}

.palette {
  width: min(600px, calc(100vw - 40px));
}
.palette-input {
  width: 100%;
  border: 0;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  background: var(--surface-3);
  color: var(--text);
  padding: 15px var(--space-5);
  font-size: var(--text-lg);
}
.palette-input:focus {
  outline: none;
}
.palette-list {
  max-height: 320px;
  overflow-y: auto;
  padding: 6px;
}
.palette-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 11px;
  border-radius: 8px;
  text-align: left;
  color: var(--text-2);
  font-size: var(--text-md);
}
.palette-item .hint {
  margin-left: auto;
  font-size: var(--text-xs);
  color: var(--text-4);
}
.palette-item[data-active="true"] {
  background: var(--accent-soft);
  color: var(--accent);
}
.palette-group {
  padding: 8px 11px 4px;
  font-size: var(--text-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-4);
  font-weight: 650;
}

/* --------------------------------- helpers -------------------------------- */
.row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.row.wrap {
  flex-wrap: wrap;
}
.row.between {
  justify-content: space-between;
}
.col {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.grow {
  flex: 1;
  min-width: 0;
}
.stack-2 {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.stack-3 {
  display: grid;
  gap: var(--space-3);
}
.stack-4 {
  display: grid;
  gap: var(--space-4);
}
.mt-2 {
  margin-top: var(--space-2);
}
.mt-3 {
  margin-top: var(--space-3);
}
.tiny {
  font-size: var(--text-xs);
}

/* ------------------------------- responsive ------------------------------- */
@media (max-width: 1280px) {
  .produce {
    grid-template-columns: 210px minmax(380px, 1fr) 270px;
  }
  .content {
    padding: var(--space-4);
  }
}
@media (max-width: 1160px) {
  :root {
    --sidebar: 196px;
  }
  .produce,
  .produce-grid {
    grid-template-columns: 200px minmax(340px, 1fr);
  }
  .produce-col.inspector {
    grid-column: 1 / -1;
    max-height: 360px;
  }
  .two-col,
  .three-col {
    grid-template-columns: minmax(0, 1fr);
  }
  .search {
    min-width: 150px;
  }
}
@media (max-width: 860px) {
  .shell {
    grid-template-columns: minmax(0, 1fr);
  }
  .sidebar {
    display: none;
  }
  .produce,
  .produce-grid {
    grid-template-columns: minmax(0, 1fr);
  }
  .produce-col.docs {
    max-height: 240px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ------------------------- piezas del prototipo -------------------------- */
.queue-strip {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(180px, 0.9fr) auto;
  align-items: center;
  gap: var(--space-4);
  padding: 9px var(--space-4);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-panel);
}
.queue-now {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.queue-now strong {
  display: block;
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.queue-now small {
  display: block;
  font-size: var(--text-xs);
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.queue-bar {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 8px;
}
.queue-bar .mono {
  color: var(--text-3);
}
.queue-bar .mono:last-child {
  color: var(--text-2);
}

.code {
  display: block;
  margin: 0;
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--bg-deep);
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  line-height: 1.7;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
}

#wave {
  position: relative;
  padding: 0 1px;
}
#wave:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
  border-radius: 4px;
}
.wave span {
  align-self: center;
}

.block .block-text {
  border: 0;
  padding: 0;
  background: none;
  color: var(--text);
  font: inherit;
  line-height: 1.5;
  text-align: left;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  cursor: pointer;
}
.block .block-text:hover {
  color: var(--accent);
}

.editor-text {
  font-family: var(--font-ui);
}

.take .btn {
  justify-self: end;
}

.produce-col.inspector .editor {
  padding: var(--space-3);
  gap: var(--space-3);
}
.produce-col.inspector .editor-text {
  min-height: 92px;
  font-size: var(--text-md);
}
.produce-col.inspector .controls-row {
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-2);
  padding: var(--space-2);
}
.produce-col.inspector .norm-preview {
  font-size: var(--text-xs);
}
.produce-col.inspector .takes-head {
  font-size: var(--text-xs);
}
.produce-col.inspector .take {
  min-width: 0;
  grid-template-columns: auto minmax(0, 1fr) auto;
  font-size: var(--text-xs);
  gap: 6px;
}
.produce-col.inspector .take .meta {
  grid-column: 1 / -1;
  color: var(--text-4);
}
.produce-col.inspector .take .btn {
  grid-column: 3;
  grid-row: 1;
}

@media (max-width: 1160px) {
  .queue-strip {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .queue-bar {
    grid-column: 1 / -1;
    order: 3;
  }
}

/* =========================================================================
   AMPLIACION 2026-11: pie fijo, splash, marca, lectura, diseno de voz, AMOLED
   Todas las reglas nuevas asumen tipografia mas grande y evitan desbordamiento.
   ========================================================================= */

/* ------------------------------- estructura ------------------------------- */
.shell {
  grid-template-rows: minmax(0, 1fr) var(--footer);
  overflow-wrap: anywhere;
}
.shell > .sidebar {
  grid-row: 1;
  height: auto;
  min-height: 0;
}
.shell > .main {
  grid-row: 1;
  min-height: 0;
}
.app-footer {
  grid-column: 1 / -1;
  grid-row: 2;
  position: sticky;
  bottom: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  min-width: 0;
  height: var(--footer);
  padding: 0 var(--space-5);
  border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg-deep) 92%, transparent);
  backdrop-filter: blur(10px);
  overflow: hidden;
}
.app-footer .footer-mark {
  display: inline-flex;
  flex: none;
}
.app-footer .footer-text {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.app-footer .footer-text b {
  color: var(--accent);
  font-weight: 700;
}
.app-footer .footer-sep {
  color: var(--text-4);
  flex: none;
}
.app-footer .footer-meta {
  font-size: var(--text-xs);
  color: var(--text-4);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
@media (max-width: 900px) {
  .app-footer .footer-meta {
    display: none;
  }
}

/* Ninguna rejilla nueva debe poder empujar el layout: minmax(0, 1fr) siempre. */
.two-col,
.three-col,
.grid-cards,
.stat-grid,
.split,
.read-grid,
.design-grid {
  min-width: 0;
}
.panel,
.card,
.stat {
  overflow-wrap: anywhere;
}
pre.code,
.code {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.table {
  table-layout: fixed;
}
.table th,
.table td {
  overflow-wrap: anywhere;
}

/* ---------------------------------- marca --------------------------------- */
.app-mark {
  display: block;
  flex: none;
}
.brand-mark {
  width: 38px;
  height: 38px;
  padding: 0;
  border: 0;
  background: none;
  border-radius: 11px;
  box-shadow: 0 0 18px rgba(34, 211, 238, 0.18);
}
.brand-mark .app-mark {
  width: 38px;
  height: 38px;
}
.modal-mark {
  display: inline-grid;
  place-items: center;
  flex: none;
}

/* ---------------------------------- splash -------------------------------- */
@keyframes vz-spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes vz-sweep {
  0% {
    background-position: -200% center;
  }
  100% {
    background-position: 200% center;
  }
}
@keyframes vz-reveal {
  from {
    opacity: 0;
    transform: translateY(20px);
    filter: blur(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
}
@keyframes vz-exit {
  to {
    opacity: 0;
    transform: scale(1.025);
    filter: blur(8px);
    visibility: hidden;
  }
}
@keyframes vz-wave {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(-50%);
  }
}
@keyframes vz-eq {
  0% {
    transform: scaleY(0.3);
    opacity: 0.6;
  }
  100% {
    transform: scaleY(1);
    opacity: 1;
  }
}
@keyframes vz-load {
  0% {
    width: 0;
  }
  80% {
    width: 100%;
    background: #00e5ff;
  }
  100% {
    width: 100%;
    background: #ffffff;
  }
}
.splash {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: linear-gradient(to bottom, #02060b, #050d18);
  color: #fff;
}
.splash.closing {
  animation: vz-exit 0.62s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  pointer-events: none;
}
.splash-glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(0, 229, 255, 0.06), transparent 68%);
  pointer-events: none;
}
.splash-wave {
  position: absolute;
  top: 50%;
  left: 0;
  width: 200%;
  display: flex;
  pointer-events: none;
  opacity: 0.14;
  mix-blend-mode: screen;
}
.splash-wave svg {
  width: 50%;
  height: 300px;
  flex: none;
}
.splash-wave.one {
  animation: vz-wave 15s linear infinite;
}
.splash-wave.two {
  opacity: 0.07;
  filter: blur(2px);
  animation: vz-wave 20s linear infinite reverse;
}
.splash-content {
  position: relative;
  z-index: 2;
  width: 100%;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 36px 24px;
  text-align: center;
}
.splash-core {
  position: relative;
  width: clamp(108px, 9vw, 142px);
  height: clamp(108px, 9vw, 142px);
  display: grid;
  place-items: center;
  animation: vz-reveal 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.splash-core .app-mark {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 26px rgba(14, 215, 242, 0.35));
}
.splash-ring {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.splash-ring.outer {
  inset: -12px;
  border: 1px solid rgba(0, 229, 255, 0.14);
  border-top-color: transparent;
  border-bottom-color: transparent;
  animation: vz-spin 10s linear infinite;
}
.splash-ring.inner {
  inset: 4px;
  border: 1px solid rgba(0, 229, 255, 0.08);
  border-left-color: transparent;
  border-right-color: transparent;
  animation: vz-spin 7s linear infinite reverse;
}
.splash-eq {
  position: absolute;
  bottom: -6px;
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 26px;
}
.splash-eq i {
  width: 4px;
  border-radius: 3px;
  background: #00e5ff;
  transform-origin: center;
  animation: vz-eq 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
}
.splash-eq i:nth-child(1) { height: 10px; animation-duration: 0.7s; }
.splash-eq i:nth-child(2) { height: 20px; animation-duration: 1.1s; animation-delay: 0.2s; }
.splash-eq i:nth-child(3) { height: 26px; animation-duration: 0.9s; animation-delay: 0.1s; }
.splash-eq i:nth-child(4) { height: 16px; animation-duration: 1.3s; animation-delay: 0.3s; }
.splash-eq i:nth-child(5) { height: 22px; animation-duration: 0.8s; animation-delay: 0.15s; }
.splash-brand {
  margin-top: clamp(24px, 3vh, 38px);
  animation: vz-reveal 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
}
.splash-brand h1 {
  margin: 0;
  font-size: clamp(38px, 5.2vw, 76px);
  line-height: 0.94;
  font-weight: 900;
  letter-spacing: -0.05em;
  color: #fff;
}
.splash-brand h1 span {
  color: transparent;
  background: linear-gradient(to right, #ffffff 20%, #00e5ff 50%, #ffffff 80%);
  background-size: 200% auto;
  background-clip: text;
  -webkit-background-clip: text;
  animation: vz-sweep 5s linear infinite;
}
.splash-brand h2 {
  margin: 14px 0 0;
  font-size: clamp(11px, 0.95vw, 14px);
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #00e5ff;
  opacity: 0.92;
}
.splash-brand p {
  margin: 10px auto 0;
  max-width: 46ch;
  font-size: var(--text-sm);
  line-height: 1.6;
  color: #8ba3ad;
}
.splash-start {
  position: relative;
  margin-top: clamp(26px, 4vh, 40px);
  padding: 4px;
  color: #fff;
  animation: vz-reveal 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both;
}
.splash-start > i {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, #00e5ff, #ffb700, #00e5ff);
  background-size: 200% 200%;
  opacity: 0.32;
  filter: blur(9px);
  transition: opacity 0.3s;
}
.splash-start > span {
  position: relative;
  min-width: 190px;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 0 30px;
  border: 1px solid rgba(0, 229, 255, 0.5);
  border-radius: 999px;
  background: #050d18;
  transition: 0.3s;
}
.splash-start strong {
  font-size: var(--text-sm);
  letter-spacing: 0.25em;
}
.splash-start .icon {
  color: #00e5ff;
  transition: transform 0.3s;
}
.splash-start:hover > i {
  opacity: 0.7;
}
.splash-start:hover > span {
  border-color: #00e5ff;
  background: #081526;
  color: #00e5ff;
}
.splash-start:hover .icon {
  transform: translateX(4px);
}
.splash-loader {
  position: relative;
  width: clamp(200px, 22vw, 330px);
  height: 3px;
  margin-top: clamp(34px, 5vh, 56px);
  border-radius: 999px;
  background: #141f2b;
  overflow: hidden;
}
.splash-loader i {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: #00e5ff;
  animation: vz-load 3s cubic-bezier(0.7, 0, 0.3, 1) 1.2s forwards;
}
.splash-credit {
  margin-top: 22px;
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: #64707f;
  animation: vz-reveal 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.3s both;
}
.splash-credit b {
  color: #8d97a4;
  font-weight: 600;
}
.splash-credit b::before {
  content: '|';
  margin: 0 12px;
  color: #37414f;
}
.splash-skip {
  position: absolute;
  right: 20px;
  bottom: 18px;
  z-index: 3;
  padding: 6px 12px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 999px;
  font-size: var(--text-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #7d8b99;
  background: rgba(255, 255, 255, 0.03);
}
.splash-skip:hover {
  color: #d5e2e8;
  border-color: rgba(0, 229, 255, 0.4);
}

/* --------------------------------- lectura -------------------------------- */
.read-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}
@media (max-width: 1180px) {
  .read-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}
.read-editor textarea {
  min-height: 340px;
  font-family: var(--font-ui);
  font-size: var(--text-md);
  line-height: 1.62;
  resize: vertical;
}
.read-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-3);
  font-size: var(--text-xs);
  color: var(--text-3);
}
.read-meta b {
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.read-meta .over {
  color: var(--danger);
  font-weight: 700;
}
.counter-bar {
  height: 4px;
  border-radius: 99px;
  background: var(--surface-3);
  overflow: hidden;
}
.counter-bar i {
  display: block;
  height: 100%;
  background: var(--accent);
  transition: width 0.18s var(--ease), background 0.18s var(--ease);
}
.counter-bar.warn i {
  background: var(--warn);
}
.counter-bar.danger i {
  background: var(--danger);
}
.preset-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
  gap: var(--space-3);
}
.preset-card {
  position: relative;
  display: grid;
  gap: 7px;
  padding: 12px 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface-2);
  text-align: left;
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease), transform 0.15s var(--ease);
  min-width: 0;
}
.preset-card:hover {
  border-color: var(--line-strong);
  transform: translateY(-1px);
}
.preset-card[aria-pressed="true"] {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent-line);
}
.preset-card header {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.preset-card header .icon {
  color: var(--tone, var(--accent));
}
.preset-card h3 {
  font-size: var(--text-sm);
  font-weight: 650;
  letter-spacing: -0.01em;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.preset-card p {
  font-size: var(--text-xs);
  line-height: 1.5;
  color: var(--text-3);
}
.preset-card .specs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.preset-card .specs span {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  padding: 1px 5px;
  border-radius: 4px;
  border: 1px solid var(--line);
  color: var(--text-3);
  background: var(--surface);
}
.drop {
  display: grid;
  place-items: center;
  gap: 8px;
  padding: 24px 16px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-md);
  background: var(--surface-2);
  text-align: center;
}
.drop.hot {
  border-color: var(--accent-line);
  background: var(--accent-soft);
}
.drop h4 {
  font-size: var(--text-md);
  font-weight: 620;
}
.file-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: var(--space-3);
  padding: 9px 2px;
  border-bottom: 1px solid var(--line);
  min-width: 0;
}
.file-row:last-child {
  border-bottom: 0;
}
.file-row .file-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: var(--text-sm);
}
.file-row .file-meta {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-4);
  white-space: nowrap;
}
@media (max-width: 720px) {
  .file-row {
    grid-template-columns: auto minmax(0, 1fr);
  }
  .file-row .file-meta,
  .file-row .btn {
    grid-column: 2;
  }
}

/* ------------------------------ diseno de voz ----------------------------- */
.design-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}
@media (max-width: 1180px) {
  .design-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}
.segmented {
  display: inline-flex;
  padding: 3px;
  gap: 3px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface-2);
  max-width: 100%;
  flex-wrap: wrap;
}
.segmented button {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--text-3);
  white-space: nowrap;
}
.segmented button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
}
.segmented button:hover[aria-pressed="false"] {
  color: var(--text);
  background: var(--surface-3);
}
.engine-fields {
  display: grid;
  gap: var(--space-3);
}
.engine-fields .field-group {
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  background: var(--surface-2);
  min-width: 0;
}
.engine-fields .field-group > .field-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-4);
  margin-bottom: 8px;
}
.engine-fields .field-group > .field-title .icon {
  color: var(--accent);
}
.engine-fields .grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-3);
}
@media (max-width: 620px) {
  .engine-fields .grid-2 {
    grid-template-columns: minmax(0, 1fr);
  }
}
.prompt-box {
  position: relative;
  display: grid;
  gap: 8px;
}
.prompt-box textarea {
  min-height: 132px;
  font-size: var(--text-md);
  line-height: 1.6;
}
.prompt-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.prompt-note {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: var(--text-xs);
  line-height: 1.5;
  color: var(--text-3);
}
.prompt-note .icon {
  color: var(--accent);
  margin-top: 1px;
}
.prompt-note b {
  color: var(--text-2);
}
.library-list {
  display: grid;
  gap: 6px;
}
.library-item {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start;
  gap: 10px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  text-align: left;
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
  min-width: 0;
}
.library-item:hover {
  border-color: var(--accent-line);
  background: var(--surface-3);
}
.library-item .prompt-text {
  font-size: var(--text-sm);
  line-height: 1.5;
  color: var(--text-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.library-item .prompt-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 5px;
  font-size: var(--text-xs);
  color: var(--text-4);
  font-family: var(--font-mono);
}
.library-item .mode-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  margin-top: 6px;
  background: var(--accent);
}
.library-item .mode-dot.instruct {
  background: var(--info);
}
.design-result {
  display: grid;
  gap: var(--space-3);
}
.design-wave {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 56px;
  padding: 0 2px;
  overflow: hidden;
}
.design-wave i {
  flex: 1;
  min-width: 2px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--accent), var(--info));
  opacity: 0.85;
}
.spec-inline {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
  gap: 8px;
}
.spec-inline div {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 9px;
  background: var(--surface-2);
  min-width: 0;
}
.spec-inline span {
  display: block;
  font-size: var(--text-xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-4);
}
.spec-inline b {
  display: block;
  margin-top: 2px;
  font-size: var(--text-sm);
  color: var(--text);
  overflow-wrap: anywhere;
}

/* -------------------------------- inicio -------------------------------- */
.greeting {
  display: grid;
  gap: 4px;
  min-width: 0;
}
.greeting h1 {
  font-size: var(--text-3xl);
  line-height: 1.12;
  letter-spacing: -0.025em;
  overflow-wrap: anywhere;
}
.greeting .greet-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  font-size: var(--text-sm);
  color: var(--text-3);
  min-width: 0;
}
.greeting .greet-line span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.greeting .greet-line .icon {
  color: var(--accent);
}
.greeting .greet-line b {
  color: var(--text);
  font-weight: 600;
}

/* --------------------------- tablas y tarjetas --------------------------- */
.table-wrap {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.card-foot {
  flex-wrap: wrap;
}
.stat strong {
  overflow-wrap: anywhere;
  font-size: var(--text-xl);
}
.badge,
.badge-x,
.chip {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toolbar {
  flex-wrap: wrap;
  gap: var(--space-2);
}
.toolbar .input {
  min-width: 0;
}

/* --------------------------------- pager -------------------------------- */
.pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding-top: var(--space-2);
}
.pager .row {
  gap: 6px;
}

/* --------------------------------- toasts -------------------------------- */
.toast {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 10px 11px;
  border: 1px solid var(--line);
  border-left: 2px solid var(--accent);
  border-radius: 8px;
  background: var(--surface-3);
  box-shadow: var(--shadow-pop);
  min-width: 0;
  max-width: 340px;
}
.toast .toast-body {
  display: grid;
  gap: 1px;
  min-width: 0;
}
.toast .toast-body strong {
  font-size: var(--text-sm);
}
.toast .toast-body span {
  font-size: var(--text-xs);
  color: var(--text-3);
  overflow-wrap: anywhere;
}
.toast .toast-icon .icon {
  color: var(--accent);
  margin-top: 1px;
}
.toast.warn {
  border-left-color: var(--warn);
}
.toast.warn .toast-icon .icon {
  color: var(--warn);
}
.toast.danger {
  border-left-color: var(--danger);
}
.toast.danger .toast-icon .icon {
  color: var(--danger);
}
.toast .toast-x {
  margin-left: auto;
  color: var(--text-4);
  flex: none;
}

/* --------------------------------- vacio --------------------------------- */
.empty {
  display: grid;
  place-items: center;
  gap: 8px;
  padding: 34px 20px;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: var(--radius-md);
  background: var(--surface-2);
}
.empty h3 {
  font-size: var(--text-lg);
  font-weight: 620;
}
.empty .empty-icon {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 12px;
  border: 1px solid var(--accent-line);
  background: var(--accent-soft);
  color: var(--accent);
}

/* ------------------------------ accesibilidad ----------------------------- */
@media (prefers-reduced-motion: reduce) {
  .splash *,
  .splash *::before,
  .splash *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
  }
}
@media (max-width: 640px) {
  .splash-content {
    padding: 24px 16px;
  }
  .splash-brand h2 {
    letter-spacing: 0.18em;
  }
  .splash-credit {
    letter-spacing: 0.2em;
  }
  .splash-credit b {
    display: block;
  }
  .splash-credit b::before {
    display: none;
  }
}

/* =========================================================================
   Responsive con la tipografia ampliada: nada debe desbordar entre 1024 y 1440
   ========================================================================= */
/* La barra superior se reparte sin empujar; los elementos secundarios se ocultan
   antes de romper el ancho. Con letra al 130 % sigue cabiendo a 1024 px. */
.topbar {
  gap: var(--space-2);
  flex-wrap: nowrap;
  min-width: 0;
}
.topbar .crumbs {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1 1 auto;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
  flex: none;
}
.topbar .search {
  min-width: 0;
  flex: 0 1 260px;
  overflow: hidden;
}
.topbar .search span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.topbar .search kbd {
  flex: none;
}
.topbar .sys-pill {
  flex: 0 1 auto;
  overflow: hidden;
  text-overflow: ellipsis;
}

@media (max-width: 1500px) {
  .topbar .sys-pill {
    display: none;
  }
}
@media (max-width: 1280px) {
  :root {
    --sidebar: 224px;
  }
  .topbar .search kbd {
    display: none;
  }
  .topbar .search {
    flex: 0 1 200px;
  }
}
@media (max-width: 1100px) {
  .topbar .search span {
    display: none;
  }
  .topbar .search {
    flex: 0 0 40px;
    justify-content: center;
    padding: 0;
  }
}
@media (max-width: 980px) {
  :root {
    --sidebar: 196px;
  }
  .topbar #project-select {
    display: none;
  }
}
@media (max-width: 860px) {
  :root {
    --sidebar: 0px;
  }
  .topbar {
    padding: 0 var(--space-3);
  }
  .content {
    padding: var(--space-3);
  }
  .app-footer {
    padding: 0 var(--space-3);
    gap: var(--space-2);
  }
  .app-footer .footer-text {
    letter-spacing: 0.1em;
    font-size: var(--text-xs);
  }
}

/* Las tablas anchas se desplazan dentro de su panel, nunca en la pagina. */
.content {
  min-width: 0;
  max-width: 100%;
}
.produce-grid {
  min-width: 0;
}
.table-wrap > .table {
  min-width: 520px;
}
@media (max-width: 720px) {
  .table-wrap > .table {
    min-width: 420px;
  }
}

/* Rejillas de tarjetas: con letra grande caben menos por fila, sin cortar. */
.grid-cards {
  grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr));
}
.preset-grid {
  grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr));
}
.stat-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr));
}
.spec-inline {
  grid-template-columns: repeat(auto-fit, minmax(min(126px, 100%), 1fr));
}

/* Botones y chips que no se salen del contenedor. */
.card-foot .btn,
.chips .badge,
.chip {
  flex: 0 1 auto;
  min-width: 0;
}
.card-foot {
  gap: 6px;
}
.modal {
  max-width: min(760px, calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.modal > .modal-body {
  overflow-y: auto;
  min-height: 0;
}
.modal.wide {
  max-width: min(900px, calc(100vw - 32px));
}
.modal-foot {
  flex-wrap: wrap;
}

/* La barra de cola tambien cede. */
.queue-strip {
  min-width: 0;
  flex-wrap: wrap;
}
.queue-strip .q-text {
  min-width: 0;
  overflow: hidden;
}
.queue-strip .q-text strong,
.queue-strip .q-text span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: block;
}

/* Etiqueta de estado en campos: distingue lo que el backend ya acepta de lo que esta
   solo en el contrato de la propuesta. */
.field-hint {
  display: block;
  margin-top: 3px;
  font-size: var(--text-xs);
  font-weight: 500;
  font-style: normal;
  letter-spacing: 0.02em;
  text-transform: none;
  color: var(--text-4);
}
.pill-plan {
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 6px;
  border-radius: 4px;
  border: 1px dashed var(--line-strong);
  color: var(--text-4);
  font-size: var(--text-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}


/* =========================================================================
   ESTRUCTURA DE APLICACION: sidebar fija y scroll solo en el cuerpo

   Regla de la casa: la ventana nunca scrollea. La sidebar queda fija, el
   topbar y el pie tambien, y de cada vista solo se desplaza lo que va
   debajo de su primera seccion (la descripcion del modulo). El scroll es
   invisible: ocupa cero pixeles y no pinta barra.

   Como funciona: cada vista es una pila vertical (.stack-4 / .stack-3) y su
   primer hijo es la cabecera de pantalla (saludo, titulo y acciones). El
   contenedor de la vista se ancla arriba en 0 y la cabecera se queda pegada
   a su borde -con fondo opaco- mientras el resto sube por debajo.
   ========================================================================= */

html,
body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

/* El scroll vive en contenedores propios: rueda siempre, sin barra ni carril. */
.shell,
.sidebar,
.content,
.stack-4,
.stack-3,
.scroll,
.table-wrap,
.produce,
.read-col,
.design-board,
.design-library-col > .panel-body,
.design-result-col > .panel-body,
.preset-body,
.takes-list,
.inspector-body,
.tray-import > .panel-body,
.scroll-area,
#block-list,
#prompt-results,
.main,
.content > .screen-fill,
.produce-col.docs > .panel-body,
.inspector-body > #block-text,
.clone-main > .panel-body.clone-body,
.clone-steps > .panel-body,
.clone-result > .panel-body {
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.shell ::-webkit-scrollbar,
.shell *::-webkit-scrollbar {
  width: 0;
  height: 0;
}

/* --- Columnas de la aplicacion ------------------------------------------- */

.shell {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

.shell > .sidebar {
  grid-row: 1;
  height: 100%;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
}

.shell > .main {
  grid-row: 1;
  height: 100%;
  /* Anula el min-height: 100vh de la regla base: con el pie en su fila,
     sumar 100vh aqui desbordaria y empujaria el pie fuera de la ventana. */
  min-height: 0;
  overflow: hidden;
}

.topbar {
  flex: none;
  position: static;
}

/* El unico carril con scroll de la columna derecha. */
.shell > .main > .content {
  flex: 1 1 auto;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  scroll-behavior: smooth;
}

/* --- Cabecera de cada pantalla, fija sobre el cuerpo ---------------------- */

.stack-4,
.stack-3 {
  position: relative;
  align-content: start;
}

/*
  Una pantalla que deba repartir altura (columnas con scroll propio) se marca
  con .screen-fill. La cabecera se queda arriba y el resto ocupa el alto que
  queda, en vez de crecer sin limite.
*/
.content > .screen-fill {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  align-content: normal;
}
.content > .screen-fill > :first-child {
  flex: none;
}

/*
  No se tocan margin ni padding del contenedor: la cabecera se pega al borde
  del area de contenido y el padding del contenedor queda por debajo de ella,
  asi que el texto no se esconde al hacer scroll.
*/
.shell > .main > .content > .stack-4 > :first-child,
.shell > .main > .content > .stack-3 > :first-child {
  position: sticky;
  top: 0;
  z-index: 6;
  /* El fondo cubre el sangrado lateral del padding del contenido. */
  margin-inline: calc(-1 * var(--space-5));
  padding-inline: var(--space-5);
  background: var(--bg);
  box-shadow: 0 6px 12px -8px var(--bg);
}

/* Produce usa .panel en su cabecera: el fondo ya es opaco y no hay que tocarlo. */

/* --- Anulacion de reglas anteriores -------------------------------------- */

.shell > .sidebar,
.shell > .main {
  grid-area: auto;
}

.app-footer {
  position: static;
  grid-row: 2;
}

/* --- Ajustes por ancho: el sangrado sigue al padding del contenido -------- */

@media (max-width: 1280px) {
  .shell > .main > .content > .stack-4 > :first-child,
  .shell > .main > .content > .stack-3 > :first-child {
    margin-inline: calc(-1 * var(--space-4));
    padding-inline: var(--space-4);
  }
}
@media (max-width: 860px) {
  .shell > .main > .content > .stack-4 > :first-child,
  .shell > .main > .content > .stack-3 > :first-child {
    margin-inline: calc(-1 * var(--space-3));
    padding-inline: var(--space-3);
  }
}

@media (prefers-reduced-motion: reduce) {
  .shell > .main > .content {
    scroll-behavior: auto;
  }
}

/* =========================================================================
   BANDEJAS HORIZONTALES Y AREAS DE SCROLL INTERNO

   Solo se desplaza lo que la pantalla necesita: la lista de segmentos en
   Producir, el cuerpo de las tablas en Biblioteca, Glosario, Lotes y Elenco,
   y las bandejas de tarjetas. Los encabezados nunca se mueven.
   ========================================================================= */

/* ------------------------------ bandeja ---------------------------------- */

.tray {
  display: grid;
  gap: var(--space-3);
  min-width: 0;
}

/*
  Una pagina exacta por vista: tantas columnas y filas como declare cada
  bandeja (--tray-cols y --tray-rows). El resto vive a la derecha y se alcanza
  desplazando; nunca se estira ni se encoge una tarjeta para hacer hueco.
*/
.tray-viewport {
  display: grid;
  grid-auto-flow: column;
  grid-template-rows: repeat(var(--tray-rows, 3), auto);
  grid-auto-columns: calc((100% - (var(--tray-cols, 4) - 1) * var(--space-3)) / var(--tray-cols, 4));
  gap: var(--space-3);
  align-content: start;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  overscroll-behavior-x: contain;
  cursor: grab;
  padding-bottom: 2px;
}
.tray-viewport.dragging {
  cursor: grabbing;
  scroll-behavior: auto;
  user-select: none;
}
.tray-viewport > * {
  scroll-snap-align: start;
  align-self: start;
  min-width: 0;
}

/* ------------------------ navegacion bajo la bandeja ---------------------- */

.tray-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  min-width: 0;
  padding-inline: 2px;
}

.tray-count {
  font-size: var(--text-xs);
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tray-count b {
  color: var(--text-2);
  font-weight: 650;
}

.tray-buttons {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
}

.tray-arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  transition: opacity 0.16s var(--ease), border-color 0.16s var(--ease), color 0.16s var(--ease);
}
.tray-arrow:hover:not(:disabled) {
  border-color: var(--accent-line);
  color: var(--accent);
}
.tray-arrow:disabled {
  opacity: 0.38;
  cursor: default;
}

/* La nota al pie sobraba: el contador de la bandeja ya lo dice. */
.tray-note {
  display: none;
}

/* -------------------- solo el cuerpo de una lista scrollea ----------------- */

.scroll-area {
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  min-height: 0;
  /* Aire al final para que el ultimo elemento no quede pegado al borde. */
  padding-bottom: var(--space-3);
  position: relative;
}

/*
  Una tabla con lista scrolleable necesita un tope de altura; si no, crece
  con su contenido y nunca hay nada que desplazar. Se acota a la ventana menos
  la cabecera de la vista y el topbar.
*/
.content > .stack-4 > .panel > .panel-body > .scroll-area.table-wrap,
.panel > .panel-body.tight > .scroll-area {
  max-height: calc(100dvh - var(--topbar) - var(--footer) - 190px);
}

/* El encabezado de una tabla se queda arriba mientras el cuerpo sube. */
.scroll-area .table thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--surface-2);
  box-shadow: inset 0 -1px 0 var(--line);
}

/* Si la tabla es mas alta que su area, la tabla scrollea; si no, se ajusta. */
.scroll-area .table-wrap,
.scroll-area.table-wrap {
  max-height: 100%;
}

/* --------------------------- lectura en 3 columnas ------------------------- */

.read-grid {
  display: grid;
  grid-template-columns: minmax(0, 30fr) minmax(0, 40fr) minmax(0, 30fr);
  gap: var(--space-4);
  /* Las columnas se estiran al alto disponible: asi su scroll interno existe. */
  align-items: stretch;
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;
}

.read-col {
  display: grid;
  gap: var(--space-4);
  align-content: start;
  min-width: 0;
  min-height: 0;
  /* Cada columna tiene su propio carril: nunca desplaza a la ventana. */
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  padding-bottom: var(--space-2);
}

/* La columna del centro da aire a las flechas de la bandeja. */
.read-col.c2 {
  padding-inline: 2px;
}

@media (max-width: 1280px) {
  .read-grid {
    grid-template-columns: minmax(0, 1fr);
    flex: none;
  }
  .read-col {
    overflow: visible;
  }
}

/* ------------------------- produce: lista de segmentos ------------------- */

.produce-col.editor {
  min-height: 0;
}
#block-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}

/* -------------------------------------------------------------------------
   Todas las tarjetas de una fila miden lo mismo. Sin esto, una tarjeta con
   mas texto estiraria su fila y descuadraria las tres filas de la bandeja.
   ------------------------------------------------------------------------- */
.card,
.preset-card {
  height: 100%;
}
/* Y el contenido se reparte: el pie de la tarjeta queda siempre abajo. */
.card > .card-foot,
.preset-card > .specs {
  margin-top: auto;
}

/* -------------------------------------------------------------------------
   LECTURA: las columnas 1 y 3 llegan al margen inferior sin perder contenido.
   La columna 2 no scrollea entera: los presets scrollean y la bandeja de
   importacion se queda siempre visible.
   ------------------------------------------------------------------------- */

/* Las tres columnas ocupan todo el alto disponible. */
.read-col.c1,
.read-col.c3 {
  overflow: hidden;
}
